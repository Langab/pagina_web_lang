teaching:
  kicker: { es: Enseñar lo que uso, en: Teaching what I use }
  title: { es: "Inteligencia artificial aplicada a la investigación social", en: "Artificial intelligence applied to social research" }
  text:
    es: "En mayo de 2024 preparé un taller para estudiantes de Sociología de la Universidad Diego Portales sobre cómo aprende un modelo, qué tareas de investigación puede asumir y cuáles son sus límites y sesgos."
    en: "In May 2024 I ran a workshop for sociology students at Universidad Diego Portales on how a model learns, which research tasks it can take on, and what its limits and biases are."
  slides_label: { es: "El taller en siete láminas", en: "The workshop in seven slides" }
  slides:
    - { title: { es: Una historia con inviernos, en: A history with winters }, text: { es: De los inviernos de la IA al boom de 2022., en: From the AI winters to the 2022 boom. } }
    - { title: { es: Cómo aprende una máquina, en: How a machine learns }, text: { es: Aprendizaje supervisado y no supervisado., en: Supervised and unsupervised learning. } }
    - { title: { es: Entrenar un algoritmo, en: Training an algorithm }, text: { es: Datos de entrenamiento y de prueba con fotos de perros., en: Training and test data with dog photos. } }
    - { title: { es: Modelos de lenguaje, en: Language models }, text: { es: "Por qué son tan grandes y qué significa «generativa»." , en: "Why they are so big and what \"generative\" means." } }
    - { title: { es: Herramientas para investigar, en: Tools for research }, text: { es: "Transcribir con Whisper, clasificar texto, revisar literatura y conversar con tus documentos.", en: "Transcribing with Whisper, classifying text, reviewing literature and chatting with your documents." } }
    - { title: { es: Los límites, en: The limits }, text: { es: "Nivel de análisis, trabajo humano-máquina y sesgos.", en: "Level of analysis, human-machine work and bias." } }
    - { title: { es: Manos a la obra, en: Hands on }, text: { es: Segunda parte práctica con las herramientas., en: A hands-on second half with the tools. } }


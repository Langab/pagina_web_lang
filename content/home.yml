  photo_alt: { es: Benjamín Lang presentando frente a un pendón del SLEP Santa Rosa, en: Benjamín Lang presenting next to an SLEP Santa Rosa banner }
  photo_caption: { es: "Presentando resultados en el SLEP Santa Rosa.", en: "Presenting results at SLEP Santa Rosa." }
  items:
    - label: { es: Herramientas, en: Tools }
      text: { es: "R, Power BI, Excel, Git, Python y SQL.", en: "R, Power BI, Excel, Git, Python and SQL." }
    - label: { es: Formación, en: Education }
      text: { es: "Sociología en la Universidad Diego Portales, con distinción máxima.", en: "Sociology at Universidad Diego Portales, with highest honors." }
    - label: { es: Idiomas, en: Languages }
      text: { es: "Español nativo, italiano C1 e inglés B2.", en: "Native Spanish, Italian C1 and English B2." }
    - label: { es: Qué busco, en: "What I'm looking for" }
      text: { es: "Un cargo de analista de datos, BI o investigación aplicada en Santiago.", en: "A data analyst, BI or applied research role in Santiago." }


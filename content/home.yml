# Reportería automática: lo que más le piden. Tres piezas en secuencia real (extracción,
# minutas, visores) y una franja que las cruza (auditable y reproducible). Todo verificado en
# projects.yml (slep, censo-2024, c22, visor-arriendos) y experience.yml.
# No nombrar a nadie del buscador de trabajo.
reporting:
  title: { es: "Reportería automática, de\u00a0la\u00a0descarga a la decisión", en: "Automated reporting, from\u00a0download to decision" }
  lede: { es: "Es lo que hago cada día en el SLEP Santa Rosa y por lo que más me han llamado este año. Un informe armado a mano depende de quien lo arma; un flujo baja los datos solo, los revisa con reglas escritas y entrega lo mismo cada vez.", en: "It's what I do every day at SLEP Santa Rosa and what employers have contacted me about most this year. A report built by hand depends on whoever builds it; a pipeline pulls the data itself, checks it against written rules and delivers the same thing every time." }
  pieces:
    - name: { es: Extracción automática, en: Automated extraction }
      why: { es: "Bajar y pegar los mismos datos cada mes mete errores, atrasa el informe y lo deja dependiendo de una persona.", en: "Downloading and pasting the same data every month lets errors in, delays the report and leaves it depending on one person." }
      where: { es: "En el SLEP Santa Rosa: scrapers en Python para 4 plataformas del Ministerio (matrícula, asistencia y evaluación) y un script maestro en R que deja las bases listas para revisar.", en: "At SLEP Santa Rosa: Python scrapers for 4 Ministry platforms (enrollment, attendance and assessment) and a master R script that leaves the datasets ready for review." }
    - name: { es: Minutas por escuela, en: A brief for each school }
      why: { es: "Cada director necesita los datos de su escuela, no el promedio del servicio. Si todas las minutas salen del mismo código, cambia la escuela pero no la definición de las cifras, y se vuelven a generar cuando llegan datos nuevos.", en: "Each principal needs their own school's data, not the service average. When every brief comes from the same code, the school changes but the definition of each figure doesn't, and they can be rebuilt when new data arrives." }
      where: { es: "Fichas por establecimiento y minutas en PDF generadas desde R, reportes mensuales automáticos en R Markdown, Quarto y LaTeX para las 5 comunas, y envíos segmentados a directores y jefaturas técnicas desde las mismas bases.", en: "School fact sheets and PDF briefs generated from R, automatic monthly reports in R Markdown, Quarto and LaTeX for the 5 municipalities, and segmented mailings to principals and technical leads from the same datasets." }
    - name: { es: Visores de datos, en: Dashboards }
      why: { es: "Un tablero bien armado responde las preguntas de cada semana sin que nadie pida un Excel, y todos miran la misma cifra.", en: "A well-built dashboard answers each week's questions without anyone asking for a spreadsheet, and everyone looks at the same number." }
      where: { es: "10 tableros de Power BI que los equipos directivos consultan cada semana, incrustados en un sitio interno que también armé.", en: "10 Power BI dashboards that management teams check every week, embedded in an internal site I also built." }
  audit:
    title: { es: Auditable y reproducible, en: Auditable and reproducible }
    text: { es: "Cada cifra tiene una definición escrita, un origen que se puede rastrear y código que otra persona puede volver a correr.", en: "Every figure has a written definition, a traceable source and code someone else can rerun." }
    items:
      - label: { es: Servicio público, en: Public service }
        text: { es: "SLEP Santa Rosa: gobierno de datos desde cero, con diccionario, estándares de calidad y documentación de cada flujo, para que no dependa de una persona.", en: "SLEP Santa Rosa: data governance from scratch, with a data dictionary, quality standards and documentation for every pipeline, so it doesn't depend on one person." }
      - label: { es: Estadística oficial, en: Official statistics }
        text: { es: "INE, Censo 2024: reglas de validación en R dentro de un código compartido en GitLab, con entorno replicable y revisión cruzada.", en: "INE, 2024 Census: validation rules in R inside a shared GitLab codebase, with a replicable environment and cross-review." }
      - label: { es: Investigación, en: Research }
        text: { es: "CEP y Fondecyt: bases armadas en R con cada decisión anotada y, en el Fondecyt, control de versiones y documentación de datos en Git, para que el análisis se pueda reproducir.", en: "CEP and Fondecyt: datasets built in R with every decision recorded and, on the Fondecyt, version control and data documentation in Git, so the analysis can be reproduced." }
      - label: { es: Proyectos propios, en: Personal projects }
        text: { es: "El visor de arriendos corre solo cada mañana, guarda una foto del día y publica el resultado. El código está abierto en GitHub.", en: "The rental finder runs itself every morning, saves a daily snapshot and publishes the result. The code is open on GitHub." }
  see: { es: Ver el caso completo del SLEP, en: See the full SLEP case }
  work: slep


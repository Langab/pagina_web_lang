hero:
  status: { es: Abierto a nuevos desafíos en datos, en: Open to new data roles }
  title:
    es: ["Del Censo 2024", "a Claude Code."]
    en: ["From the 2024 Census", "to Claude Code."]
  lede:
    es: Soy **Benjamín Lang**, sociólogo y analista de datos en Santiago. Validé datos del Censo en el INE, analicé el proceso constitucional en el CEP y hoy ordeno los datos de la educación pública en Santa Rosa. Cuando un problema me intriga, armo la herramienta que lo resuelve.
    en: I'm **Benjamín Lang**, a sociologist and data analyst in Santiago, Chile. I validated Census data at INE, analyzed the constitutional process at CEP, and today I organize public education data in Santa Rosa. When a problem gets under my skin, I build the tool that solves it.
  cta_primary: { es: Ver proyectos, en: See projects }
  cta_secondary: { es: Descargar CV, en: Download CV }
  photo_alt: { es: Benjamín Lang presentando frente a un pendón del SLEP Santa Rosa, en: Benjamín Lang presenting next to an SLEP Santa Rosa banner }
  photo_caption: { es: "Presentando en el SLEP Santa Rosa", en: "Presenting at SLEP Santa Rosa" }
  meta:
    - value: "5"
      label: { es: "años con datos públicos, académicos y privados", en: "years working with public, academic and private data" }
    - value: live_total
      label: { es: avisos de arriendo que mi visor revisó esta mañana, en: rental listings my finder checked this morning }
    - value: "14"
      label: { es: publicaciones con el CEP y C22, en: publications with CEP and C22 }


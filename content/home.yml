    en: "Sociologist from Universidad Diego Portales, graduated with highest honors. **Five years processing and analyzing data** at Chile's National Statistics Institute, Centro de Estudios Públicos, Universidad Diego Portales and, today, SLEP Santa Rosa. I work with R, Python, SQL and Power BI, and I build tools that update themselves."

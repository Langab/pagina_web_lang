      problem: { es: "Que alguien sin formación técnica entienda qué dicen los datos y qué cambia para su decisión.", en: "Someone without a technical background understands what the data says and what it changes for their decision." }
      solution: { es: "El boletín constitucional semanal para gerencias y directorios en Tironi, y Voces del CEP, que traducía encuestas para un público amplio.", en: "The weekly constitutional bulletin for executives and boards at Tironi, and Voces del CEP, which translated surveys for a broad audience." }
      tags: [R, ggplot2, { es: Opinión pública, en: Public opinion }]
      work: c22
    - org: { es: Investigación con Joaquín Prieto, en: Research with Joaquín Prieto }

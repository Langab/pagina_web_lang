      problem: { es: "Encontrar valores imposibles o incoherentes y corregirlos con métodos documentados antes de publicar.", en: "Finding impossible or inconsistent values and fixing them with documented methods before publication." }
      solution: { es: "Reglas de validación en R para sexo, edad y parentesco, e informes de calidad para decidir entre escenarios de edición.", en: "Validation rules in R for sex, age and relationship, and quality reports to choose between editing scenarios." }

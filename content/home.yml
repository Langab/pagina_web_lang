# Lo que hago: cada tarjeta es un tipo de trabajo con un caso real, su cifra y el enlace a la
# ventana del proyecto en /trabajos/ (`work` = id del trabajo en projects.yml).
areas:
  kicker: { es: En la práctica, en: In practice }
  title: { es: "Lo que hago, con ejemplos", en: "What I do, with examples" }
  lede: { es: "Seis tipos de trabajo que he repetido en distintos equipos. Cada uno abre el proyecto donde se ve en detalle.", en: "Six kinds of work I've done again and again across teams. Each one opens the project where you can see it in detail." }
  see: { es: Ver el proyecto, en: See the project }
  items:
    - title: { es: Automatizo la captura de datos, en: I automate data capture }
      stat: { value: "4", label: { es: plataformas del Ministerio automatizadas, en: Ministry platforms automated } }
      text:
        es: "En el SLEP Santa Rosa cambié las descargas a mano desde cuatro plataformas del Ministerio por scrapers en Python y un script maestro en R que deja las bases listas para la revisión mensual."
        en: "At SLEP Santa Rosa I replaced manual downloads from four Ministry platforms with Python scrapers and a master R script that leaves the datasets ready for the monthly check."
      tags: [Python, R, PowerShell]
      work: slep
    - title: { es: Armo tableros e informes que el equipo usa, en: I build dashboards and reports teams use }
      stat: { value: "10", label: { es: tableros de Power BI publicados, en: Power BI dashboards published } }
      text:
        es: "Diez tableros de Power BI en el sitio interno del SLEP, fichas por escuela generadas desde R y, antes, un tablero público de nueve páginas para el Fondo del Libro."
        en: "Ten Power BI dashboards on SLEP's internal site, school fact sheets generated from R and, earlier, a nine-page public dashboard for Fondo del Libro."
      tags: [Power BI, R Markdown, Excel]
      work: slep
    - title: { es: Valido bases grandes, en: I validate large datasets }
      stat: { value: "18.5", label: { es: millones de personas en el Censo 2024, en: million people in the 2024 Census } }
      text:
        es: "En el INE escribí y corregí reglas en R para validar sexo, edad y parentesco, y armé informes de calidad para comparar escenarios de edición antes de decidir."
        en: "At INE I wrote and fixed R rules to validate sex, age and relationship, and built quality reports to compare editing scenarios before a decision was made."
      tags: [R, R Markdown, renv, GitLab]
      work: censo-2024
    - title: { es: Diseño y analizo encuestas, en: I design and analyze surveys }
      stat: { value: "8", label: { es: olas del panel ELSOC procesadas, en: ELSOC panel waves processed } }
      text:
        es: "Con Joaquín Prieto preparé ocho olas del panel ELSOC (2016 a 2023), armé un índice de inseguridad económica y estimé modelos logísticos con imputación múltiple. En consultorías también asesoro el diseño de encuestas antes del terreno."
        en: "With Joaquín Prieto I prepared eight waves of the ELSOC panel (2016 to 2023), built an economic insecurity index and fit logistic models with multiple imputation. In consulting work I also advise on survey design before fieldwork."
      tags: [R, ELSOC, { es: Imputación múltiple, en: Multiple imputation }, SPSS]
      work: prieto
    - title: { es: Clasifico texto con modelos de lenguaje, en: I classify text with language models }
      stat: { value: "1467", label: { es: memorandos del Banco Central codificados, en: Central Bank memos coded } }
      text:
        es: "Diseñé el prompt y las categorías para codificar con GPT-4o tres años de actas del Banco Central (1981 a 1983), y después analicé la base con redes y modelos de tópicos."
        en: "I designed the prompt and the categories to code three years of Central Bank minutes (1981 to 1983) with GPT-4o, then analyzed the dataset with networks and topic models."
      tags: [Python, OpenAI API, R, STM]
      work: fondecyt-bc
    - title: { es: Explico los datos a quien decide, en: I explain data to the people who decide }
      stat: { value: "7", label: { es: Puntos de Referencia del CEP como coautor, en: CEP policy papers as co-author } }
      text:
        es: "En el CEP convertí votaciones, discursos y encuestas en análisis publicables, y en 2022 escribí el boletín constitucional semanal que Tironi mandaba a gerencias y directorios."
        en: "At CEP I turned votes, speeches and surveys into publishable analysis, and in 2022 I wrote the weekly constitutional bulletin Tironi sent to executives and boards."
      tags: [R, ggplot2, { es: Opinión pública, en: Public opinion }]
      work: c22


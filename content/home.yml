story:
  kicker: { es: Método de trabajo, en: How I work }
  title: { es: De una pregunta a una decisión, en: From a question to a decision }
  lede: { es: "Los puntos de la animación son registros: personas, avisos o documentos. Así paso de una base desordenada a algo que una institución usa.", en: "The dots in the animation are records: people, listings or documents. This is how I get from a messy dataset to something an institution uses." }
  steps:
    - label: { es: "720 puntos sueltos", en: "720 loose dots" }
      title: { es: Primero la pregunta y la decisión, en: First the question and the decision }
      text:
        es: "¿Por qué las escuelas rurales casi no usan la biblioteca digital? ¿Qué discutía el Banco Central en plena crisis? Antes de abrir R defino la pregunta y, sobre todo, **qué decisión depende de la respuesta**. De ahí salen el diseño, las fuentes y la precisión que hace falta."
        en: "Why do rural schools barely use the digital library? What was the Central Bank discussing during the crisis? Before opening R I define the question and, above all, **which decision depends on the answer**. The design, the sources and the precision needed follow from that."
      tools: [{ es: Diseño metodológico, en: Research design }, { es: Encuestas, en: Surveys }, { es: Entrevistas, en: Interviews }]
    - label: { es: "Una grilla ordenada", en: "An ordered grid" }
      title: { es: "Después, datos en los que se puede confiar", en: Then data you can trust }
      text:
        es: "Validar el Censo 2024 me enseñó que la mayor parte del trabajo es limpiar, cruzar y documentar. **Reglas explícitas, código versionado que otra persona puede volver a correr** y los supuestos escritos."
        en: "Validating the 2024 Census taught me that most of the work is cleaning, joining and documenting. **Explicit rules, versioned code someone else can rerun** and written assumptions."
      tools: [R, SQL, Python, Git]
    - label: { es: "Dos grupos que se comparan", en: "Two groups compared" }
      title: { es: Luego el método que pide la pregunta, en: Then the method the question calls for }
      text:
        es: "Regresiones logísticas con imputación múltiple para el panel ELSOC; redes y modelos de tópicos para los memorandos del Banco Central. **Cada resultado va con sus límites**, y los nulos también se informan."
        en: "Logistic regressions with multiple imputation for the ELSOC panel; networks and topic models for the Central Bank memos. **Every result comes with its limits**, and null results get reported too."
      tools: [{ es: Modelos estadísticos, en: Statistical models }, GPT-4o, { es: Análisis de redes, en: Network analysis }, STM]
    - label: { es: "Los que importan", en: "The ones that matter" }
      title: { es: Y termina en algo que la institución usa, en: And it ends in something the institution uses }
      text:
        es: "Un informe, un tablero o un flujo de reportes que el equipo pueda volver a correr sin mí. En el SLEP Santa Rosa son **diez tableros de Power BI con revisión mensual** y fichas por escuela que se vuelven a generar desde R."
        en: "A report, a dashboard or a reporting pipeline the team can rerun without me. At SLEP Santa Rosa that's **ten Power BI dashboards checked every month** and school fact sheets that can be regenerated from R."
      tools: [Power BI, Quarto, GitHub Actions, Claude Code]


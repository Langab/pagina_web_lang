  status: { es: "Analista de datos y sociólogo, abierto a cargos de análisis, BI e investigación en Santiago", en: "Data analyst and sociologist, open to analytics, BI and research roles in Santiago" }
  name: Benjamín Lang
  title: { es: "Analizo datos sobre personas y se los explico a quien decide.", en: "I analyze data about people and explain it to decision-makers." }
  lede:
    es: "Validé datos del Censo 2024 en el INE y analicé el proceso constitucional para el CEP y Tironi. Hoy llevo los datos de educación pública del SLEP Santa Rosa."
    en: "I validated 2024 Census data at INE and analyzed Chile's constitutional process for CEP and Tironi. Today I lead data work for public schools at SLEP Santa Rosa."
  cta_cv: { es: Descargar CV, en: Download CV (in Spanish) }


areas:
  kicker: { es: Especialización, en: Expertise }
  title: { es: Áreas de trabajo, en: Areas of work }
  lede: { es: "Cuatro cosas que he hecho de forma repetida en estadística oficial, centros de estudio, consultoría y educación pública.", en: "Four things I've done repeatedly in official statistics, think tanks, consulting and public education." }
  items:
    - title: { es: Ciencia de datos y estadística aplicada, en: Data science and applied statistics }
      text:
        es: "En el INE validé y edité las variables básicas del Censo 2024, y construí indicadores demográficos comparados con los censos de 2017, 2002 y 1992."
        en: "At INE I validated and edited the core variables of the 2024 Census, and built demographic indicators compared with the 2017, 2002 and 1992 censuses."
      tags: [R, R Markdown, Python, { es: Control de calidad, en: Quality control }]
    - title: { es: Gobernanza de datos en organizaciones, en: Data governance in organizations }
      text:
        es: "En el SLEP Santa Rosa definí cómo se capturan, validan y comparten los datos de las escuelas de cinco comunas, con reportes que cualquiera del equipo puede volver a correr."
        en: "At SLEP Santa Rosa I defined how the schools of five municipalities capture, validate and share data, with reports anyone on the team can rerun."
      tags: [Power BI, R Markdown, Excel, { es: Capacitación, en: Training }]
    - title: { es: Diseño y análisis de encuestas, en: Survey design and analysis }
      text:
        es: "Revisé el cuestionario y analicé las 1.273 respuestas válidas de la encuesta Radiografía a la Equidad Puertas Adentro, y trabajo datos de panel de ELSOC y de la Encuesta de Bienestar Social."
        en: "I reviewed the questionnaire and analyzed the 1,273 valid responses of the Radiografía a la Equidad Puertas Adentro survey, and I work with ELSOC panel data and INE's Social Wellbeing Survey."
      tags: [SPSS, R, { es: Muestreo, en: Sampling }, { es: Tablas cruzadas, en: Cross-tabs }]
    - title: { es: Informes y análisis para decidir, en: Reports and analysis for decisions }
      text:
        es: "Siete Puntos de Referencia del CEP, el boletín constitucional semanal de 2022 para clientes de Tironi y el informe cuantitativo de lectura digital para el Fondo del Libro."
        en: "Seven CEP policy papers, the weekly 2022 constitutional bulletin for Tironi's clients, and the quantitative report on digital reading for Fondo del Libro."
      tags: [{ es: Análisis de texto, en: Text analysis }, { es: Datos electorales, en: Electoral data }, { es: Opinión pública, en: Public opinion }]

story:
  kicker: { es: Método de trabajo, en: How I work }
  title: { es: De una pregunta a una decisión, en: From a question to a decision }
  lede: { es: "Cada punto es una persona, un aviso o un documento. Mi trabajo es ordenarlos hasta que digan algo útil.", en: "Every dot is a person, a listing or a document. My job is to arrange them until they say something useful." }
  steps:
    - label: { es: "720 puntos sueltos", en: "720 loose dots" }
      title: { es: Empieza con una pregunta, en: It starts with a question }
      text:
        es: "¿Por qué las escuelas rurales casi no usan la biblioteca digital? ¿Qué discutía el Banco Central en plena crisis? Antes de abrir R defino la pregunta y, sobre todo, **qué decisión depende de la respuesta**. De ahí salen el diseño, las fuentes y la precisión que hace falta."
        en: "Why do rural schools barely use the digital library? What was the Central Bank discussing during the crisis? Before opening R I define the question and, above all, **which decision depends on the answer**. The design, the sources and the precision needed follow from that."
      tools: [{ es: Diseño metodológico, en: Research design }, { es: Encuestas, en: Surveys }, { es: Entrevistas, en: Interviews }]
    - label: { es: "Una grilla ordenada", en: "An ordered grid" }
      title: { es: "Luego, datos en los que se puede confiar", en: "Then, data you can trust" }
      text:
        es: "Validar el Censo 2024 me enseñó que la mayor parte del trabajo es limpiar, cruzar y documentar. **Reglas explícitas, código versionado que otra persona puede volver a correr** y los supuestos escritos."
        en: "Validating the 2024 Census taught me that most of the work is cleaning, joining and documenting. **Explicit rules, versioned code someone else can rerun** and written assumptions."
      tools: [R, SQL, Python, Git]
    - label: { es: "Dos grupos que se comparan", en: "Two groups compared" }
      title: { es: El análisis busca diferencias que importan, en: Analysis looks for differences that matter }
      text:
        es: "Modelos estadísticos, análisis de redes o clasificación automática de texto cuando el corpus es grande. **La técnica se elige por la pregunta** y se reporta con sus límites, incluidos los resultados nulos."
        en: "Statistical models, network analysis or automated text classification when the corpus is large. **The method is chosen by the question** and reported with its limits, including null results."
      tools: [{ es: Modelos estadísticos, en: Statistical models }, GPT-4o, { es: Análisis de redes, en: Network analysis }, STM]
    - label: { es: "{match} puntos que importan", en: "{match} dots that matter" }
      title: { es: Y termina en algo que alguien usa, en: And it ends in something someone uses }
      text:
        es: "Un informe, un tablero o una herramienta que se actualiza sola y que el equipo puede auditar. Mi visor de arriendos revisa más de mil avisos cada mañana y **hoy dejó {match} candidatos**."
        en: "A report, a dashboard or a self-updating tool the team can audit. My rental finder reviews over a thousand listings every morning and **today it left {match} candidates**."
      tools: [Power BI, Quarto, GitHub Actions, Claude Code]


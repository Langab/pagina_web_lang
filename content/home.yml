story:
  kicker: { es: Cómo trabajo, en: How I work }
  title: { es: De una pregunta a una decisión, en: From a question to a decision }
  lede: { es: "Cada punto es una persona, un aviso o un documento. Mi trabajo es ordenarlos hasta que digan algo útil.", en: "Every dot is a person, a listing or a document. My job is to arrange them until they say something useful." }
  steps:
    - label: { es: "720 puntos sueltos", en: "720 loose dots" }
      title: { es: Empieza con una pregunta, en: It starts with a question }
      text:
        es: "¿Por qué las escuelas rurales casi no usan la biblioteca digital? ¿Qué discutía el Banco Central en plena crisis? Antes de abrir R, me siento a entender **qué decisión depende de la respuesta**."
        en: "Why do rural schools barely use the digital library? What was the Central Bank arguing about in the middle of a crisis? Before opening R, I sit down to understand **which decision depends on the answer**."
      tools: [{ es: Diseño metodológico, en: Research design }, { es: Encuestas, en: Surveys }, { es: Entrevistas, en: Interviews }]
    - label: { es: "Una grilla ordenada", en: "An ordered grid" }
      title: { es: "Luego, datos en los que se puede confiar", en: "Then, data you can trust" }
      text:
        es: Validar el Censo me enseñó que el 80% del trabajo es limpiar, cruzar y documentar. **Reglas explícitas, código que otro puede volver a correr** y nada de planillas mágicas.
        en: Validating the Census taught me that 80% of the work is cleaning, joining and documenting. **Explicit rules, code someone else can rerun**, no magic spreadsheets.
      tools: [R, SQL, Python, Git]
    - label: { es: "Dos grupos que se comparan", en: "Two groups compared" }
      title: { es: El análisis busca diferencias que importan, en: Analysis looks for differences that matter }
      text:
        es: Modelos estadísticos, redes, análisis de texto o modelos de lenguaje cuando hay miles de documentos. **La técnica sale de la pregunta**, no al revés.
        en: Statistical models, networks, text analysis, or language models when there are thousands of documents. **The method follows the question**, not the other way around.
      tools: [{ es: Modelos estadísticos, en: Statistical models }, GPT-4o, { es: Análisis de redes, en: Network analysis }, STM]
    - label: { es: "{match} puntos que importan", en: "{match} dots that matter" }
      title: { es: Y termina en algo que alguien usa, en: And it ends in something someone uses }
      text:
        es: Un dashboard, un informe o una herramienta que se actualiza sola. Mi visor de arriendos parte con más de mil avisos cada mañana y **hoy me dejó {match} para visitar**.
        en: A dashboard, a report, or a tool that updates itself. My rental finder starts with over a thousand listings every morning and **today it left me {match} to visit**.
      tools: [Power BI, Quarto, GitHub Actions, Claude Code]


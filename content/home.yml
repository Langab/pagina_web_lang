# Mi perfil: lo que me distingue es juntar tres oficios que suelen ser de personas distintas.
# Se dibuja como tres círculos de puntos; cada uno lleva el lugar donde aprendí ese oficio y el
# centro, el trabajo donde hoy se juntan. Sin cifras: las cifras van en las tarjetas de trabajos.
mix:
  kicker: { es: Mi perfil, en: My profile }
  title: { es: "Analizo datos, los explico y los diseño para que se usen", en: "I analyze data, explain it and design it so people actually use it" }
  lede: { es: "Casi siempre son tres personas distintas: quien analiza, quien comunica y quien diseña. Yo aprendí cada oficio en un lugar distinto y hoy los junto en el mismo trabajo.", en: "These are usually three different people: the analyst, the communicator and the designer. I learned each craft in a different place, and today I bring them together in one job." }
  items:
    - key: a
      label: { es: Análisis de datos, en: Data analysis }
      text: { es: "Validé datos del Censo 2024 en el INE, clasifiqué con IA las actas del Banco Central y hoy armo el gobierno de datos del SLEP Santa Rosa.", en: "I validated 2024 Census data at INE, classified Central Bank minutes with AI and now run data governance at SLEP Santa Rosa." }
      link: { work: censo-2024, label: { es: Ver el Censo 2024, en: See the 2024 Census } }
    - key: b
      label: { es: Comunicación estratégica, en: Strategic communication }
      text: { es: "En Tironi escribía cada semana para gerencias y directorios, y en el CEP convertía encuestas y votaciones en textos para un público amplio.", en: "At Tironi I wrote every week for executives and boards, and at CEP I turned surveys and votes into pieces for a broad audience." }
      link: { work: tironi, label: { es: Ver el boletín de Tironi, en: See the Tironi bulletin } }
    - key: c
      label: { es: Diseño y visualización, en: Design and visualization }
      text: { es: "Tableros de Power BI, gráficos para publicaciones y prensa, y sitios web que construyo yo mismo, como este. En la UDP di un seminario sobre cómo trabajar con imágenes.", en: "Power BI dashboards, charts for publications and the press, and websites I build myself, like this one. At UDP I gave a seminar on working with images." }
      link: { project: guaren, label: { es: Ver El Guarén, en: See El Guarén } }
  center:
    label: { es: Donde se juntan, en: Where they meet }
    text: { es: "En el SLEP Santa Rosa hago las tres cosas a la vez: ordeno los datos, diseño los tableros y presento los resultados a los equipos.", en: "At SLEP Santa Rosa I do all three at once: I organize the data, design the dashboards and present the results to the teams." }
  # Rótulos dentro del diagrama: dónde aprendí cada oficio
  places: { a: INE, b: Tironi, c: { es: Sitios propios, en: My own sites }, ab: CEP, abc: SLEP Santa Rosa }

# Lo que sé hacer: cada tarjeta es una capacidad, con lo que le resuelve a una institución, el
# lugar donde la hice y una cifra; abre la ventana del proyecto en /trabajos/ (`work` = id del
# trabajo en projects.yml). La primera, con `featured: true`, va grande con lo que incluye.
# Fuente: el CV maestro de buscador_trabajo (perfil, competencias y experiencia).
areas:
  kicker: { es: Lo que sé hacer, en: What I do }
  title: { es: "Gobierno de datos, de la captura al tablero", en: "Data governance, from capture to dashboard" }
  lede: { es: "Seis cosas que sé hacer en una institución, cada una con el lugar donde la hice. Haz clic en cualquiera para ver el caso completo.", en: "Six things I can do for an organization, each with the place where I did it. Click any of them for the full case." }
  problem_label: { es: Lo que resuelve, en: What it solves }
  solution_label: { es: Dónde lo hice, en: Where I did it }
  result_label: { es: Lo que queda funcionando, en: What keeps running }
  includes_label: { es: Lo que incluye, en: What it includes }
  see: { es: Ver el caso, en: See the case }
  items:
    - featured: true
      org: SLEP Santa Rosa
      when: { es: "2025 – hoy", en: "2025 – now" }
      title: { es: "Gobierno de datos, desde cero", en: "Data governance, from scratch" }
      stats:
        - { value: "10", label: { es: tableros de Power BI que los equipos directivos consultan cada semana, en: Power BI dashboards management teams check every week } }
      problem: { es: "Que cada cifra tenga una sola definición, un origen que se puede rastrear y una revisión de calidad antes de llegar a un informe, aunque cambie el equipo.", en: "Every figure gets one definition, a traceable source and a quality check before it reaches a report, even when the team changes." }
      solution: { es: "En el SLEP Santa Rosa armé el marco completo: cómo se capturan, validan, nombran y comparten los datos, con el proceso documentado para que no dependa de una persona.", en: "At SLEP Santa Rosa I built the whole framework: how data is captured, validated, named and shared, with the process documented so it doesn't depend on one person." }
      result: { es: "Tableros de Power BI y reportes mensuales automáticos en R Markdown, Quarto y LaTeX, publicados en un sitio interno de reportería que también construí.", en: "Power BI dashboards and automatic monthly reports in R Markdown, Quarto and LaTeX, published on an internal reporting site I also built." }
      includes: [{ es: Diccionario de datos, en: Data dictionary }, { es: Estándares de calidad, en: Quality standards }, { es: Reglas de captura y nombres, en: Capture and naming rules }, { es: Documentación de cada flujo, en: Documentation for every pipeline }, { es: Sitio de reportería, en: Reporting site }]
      tags: [Power BI, R, Quarto, Git]
      work: slep
    - org: SLEP Santa Rosa
      when: { es: "2025 – hoy", en: "2025 – now" }
      title: { es: Flujos de datos automáticos, en: Automated data pipelines }
      stats:
        - { value: "4", label: { es: plataformas del Ministerio sin descargas a mano, en: Ministry platforms no longer downloaded by hand } }
      problem: { es: "Que nadie tenga que bajar y pegar los mismos datos a mano cada mes.", en: "Nobody has to download and paste the same data by hand every month." }
      solution: { es: "Scrapers en Python para matrícula, asistencia y evaluación, y un script maestro en R que deja las bases listas para revisar.", en: "Python scrapers for enrollment, attendance and assessment, and a master R script that leaves the datasets ready for review." }

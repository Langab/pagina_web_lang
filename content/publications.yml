intro:
  es: Entre 2021 y 2024 escribí con el equipo de Aldo Mascareño en el CEP sobre el proceso constitucional, la polarización y el voto. Casi todo nació de bases de datos de texto y encuestas que había que ordenar primero.
  en: Between 2021 and 2024 I co-wrote with Aldo Mascareño's team at CEP about Chile's constitutional process, polarization and voting. Almost everything started from text and survey data that had to be cleaned first.


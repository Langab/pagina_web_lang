  - id: fondecyt-bc
    home: true
    area: [research]
    years: "2024 – 2025"
    title: { es: "Gobernar la incertidumbre: el Banco Central en la crisis de 1982", en: "Governing uncertainty: Chile's Central Bank in the 1982 crisis" }
    org: { es: "Fondecyt N° 1231356, Universidad Diego Portales", en: "Fondecyt grant 1231356, Universidad Diego Portales" }
    role: { es: Investigador, en: Researcher }
    preview: projects/fondecyt-bc/red.jpg
    modal:
      intro:
        es: "El proyecto estudia cómo el Banco Central de Chile produce «estabilidad» económica. Mi parte fue la crisis de 1981 a 1983: convertir tres años de actas del Comité Ejecutivo en una base codificada y analizable, y describir con ella qué problemas discutía el Banco, qué acciones tomaba y a quién iban dirigidas."
        en: "The project studies how Chile's Central Bank produces economic \"stability\". My part covered the 1981–1983 crisis: turning three years of Executive Committee minutes into a coded, analyzable dataset, and using it to describe which problems the Bank discussed, which actions it took and who those actions targeted."
      cover:
        src: projects/fondecyt-bc/red.jpg
        alt: { es: Red de co-ocurrencia de problemas, en: Co-occurrence network of problems }
        caption: { es: "Red de co-ocurrencia: cada nodo es una categoría y cada enlace, dos categorías que aparecen en el mismo memorándum. Los colores son las comunidades detectadas con el algoritmo de Louvain.", en: "Co-occurrence network: each node is a category and each link, two categories appearing in the same memo. Colors are the communities detected with the Louvain algorithm." }
      numbers:
        - { value: 144, label: { es: "actas del Comité Ejecutivo (1981, 1982 y 1983)", en: "Executive Committee minutes (1981, 1982, 1983)" } }
        - { value: 1467, label: { es: memorandos codificados como unidad de análisis, en: memos coded as the unit of analysis } }
        - { value: 885, label: { es: memorandos vinculados a la crisis, en: memos linked to the crisis } }

work:
  - id: censo-2024
    home: true
    area: [public]
    years: "2024 – 2025"
    title: { es: Censo de Población y Vivienda 2024, en: 2024 Population and Housing Census }
    org: { es: Instituto Nacional de Estadísticas (INE), en: National Statistics Institute of Chile (INE) }
    role: { es: Analista metodológico senior, en: Senior methods analyst }
    preview: logos/censo_2024.svg
    modal:
      intro:
        es: Contar a todo un país es la parte fácil de explicar. Lo difícil es que 18 millones de respuestas lleguen limpias y coherentes a las tablas finales. Trabajé en el equipo de procesamiento del INE, dentro del código en R que lleva cada dato desde la recolección hasta los indicadores.
        en: Counting an entire country is the easy part to explain. The hard part is getting 18 million answers to the final tables clean and consistent. I worked on INE's processing team, inside the R codebase that carries every data point from collection to indicators.
      numbers:
        - { value: 18480432, label: { es: personas censadas en el resultado oficial, en: people counted in the official result } }
        - { value: 10, label: { es: etapas de procesamiento entre la integración y los tabulados, en: processing stages from integration to final tables } }
        - { value: 14, suffix: "%", label: { es: "tiene 65 años o más; en 1992 era 6,6%", en: "are 65 or older, up from 6.6% in 1992" } }
      flow_title: { es: Así viaja un dato, en: How a data point travels }
      flow:
        - { title: { es: Integración, en: Integration }, text: { es: "Respuestas en tablet, web y papel en una sola base.", en: "Tablet, web and paper answers merged into one database." } }
        - { title: { es: Codificación, en: Coding }, text: { es: Respuestas abiertas asignadas a códigos con diccionarios., en: Open answers matched to codes with dictionaries. } }
        - { title: { es: Validación, en: Validation }, text: { es: Reglas que detectan valores imposibles o incoherentes., en: Rules that catch impossible or inconsistent values. } }
        - { title: { es: Edición e imputación, en: Editing and imputation }, text: { es: Corregir y completar con métodos documentados., en: Fixing and filling in with documented methods. } }
        - { title: { es: Indicadores, en: Indicators }, text: { es: Tabulados y comparaciones con censos anteriores., en: Tables and comparisons with past censuses. } }
      did:
        - { title: { es: "Sexo, edad y parentesco", en: "Sex, age and relationship" }, text: { es: "Escribí y corregí reglas en R para validar y completar las variables básicas de cada persona. Por ejemplo, inferir el sexo a partir del nombre cuando faltaba.", en: "I wrote and fixed R rules to validate and fill in each person's core variables. For example, inferring sex from the first name when it was missing." } }
        - { title: { es: Informes de calidad, en: Quality reports }, text: { es: Reportes en R Markdown para revisar la edad y comparar escenarios de edición antes de decidir., en: R Markdown reports to review age data and compare editing scenarios before deciding. } }
        - { title: { es: Comparar con la historia, en: Checking against history }, text: { es: "Indicadores demográficos para contrastar el Censo 2024 con los de 2017, 2002 y 1992.", en: "Demographic indicators to compare the 2024 Census with those of 2017, 2002 and 1992." } }
        - { title: { es: Cuestionarios en papel, en: Paper questionnaires }, text: { es: "Variables del formulario en papel y codificación automática de respuestas abiertas contra diccionarios, con revisión de los casos que el diccionario no resolvía.", en: "Paper form variables and automatic coding of open answers against dictionaries, reviewing the cases the dictionary couldn't resolve." } }
        - { title: { es: Imputación, en: Imputation }, text: { es: "Participé en la etapa de imputación de las variables de personas, donde se probaron distintos métodos antes de fijar el procedimiento definitivo.", en: "I took part in the imputation stage for person-level variables, where several methods were tested before settling the final procedure." } }
        - { title: { es: Trabajo en un código compartido, en: Working in a shared codebase }, text: { es: "Todo se hizo dentro de un repositorio en R con control de versiones y entorno replicable, junto a un equipo grande y con revisiones cruzadas.", en: "Everything was done inside a version-controlled R repository with a reproducible environment, alongside a large team and with peer review." } }
      tools: [R, R Markdown, renv, GitLab]
      note: { es: "El código y los microdatos son del INE y no se publican. Las cifras son las oficiales de [censo2024.ine.gob.cl](https://censo2024.ine.gob.cl/).", en: "The code and microdata belong to INE and aren't public. Figures are the official ones from [censo2024.ine.gob.cl](https://censo2024.ine.gob.cl/)." }
      links:
        - { label: { es: Resultados del Censo, en: Census results }, url: "https://censo2024.ine.gob.cl/" }

  - id: c22
    home: true
    area: [research]
    years: "2021 – 2024"
    title: { es: "C22: el proceso constitucional en datos", en: "C22: the constitutional process in data" }
    org: { es: Centro de Estudios Públicos (CEP), en: Centro de Estudios Públicos (CEP) }
    role: { es: Asistente de investigación, en: Research assistant }
    preview: logos/c22.png
    modal:
      intro:
        es: "Entre 2021 y 2024 Chile escribió dos propuestas de constitución y rechazó ambas. C22 fue el proyecto del CEP que siguió ese proceso con datos, dirigido por Aldo Mascareño. Trabajé en el equipo que convirtió votaciones, discursos y encuestas en análisis publicables, y firmé como coautor siete Puntos de Referencia y seis notas de investigación."
        en: "Between 2021 and 2024 Chile drafted two constitutions and rejected both. C22 was CEP's project tracking that process with data, led by Aldo Mascareño. I worked on the team that turned votes, speeches and surveys into publishable analysis, and co-authored seven policy papers and six research notes."
      numbers:
        - { value: 7, label: { es: Puntos de Referencia del CEP como coautor, en: CEP policy papers as co-author } }
        - { value: 6, label: { es: notas de investigación en C22, en: C22 research notes } }
        - { value: 2, label: { es: procesos constitucionales seguidos de principio a fin, en: constitutional processes tracked end to end } }
      flow_title: { es: Cómo trabajábamos un tema, en: How we worked on a topic }
      flow:
        - { title: { es: Fuente, en: Source }, text: { es: "Votaciones nominales, discursos, prensa o encuestas, según la pregunta.", en: "Roll-call votes, speeches, press or surveys, depending on the question." } }
        - { title: { es: Base, en: Dataset }, text: { es: "Construcción y limpieza de la base en R, con el detalle de cada decisión.", en: "Building and cleaning the dataset in R, documenting each decision." } }
        - { title: { es: Método, en: Method }, text: { es: "Escalamiento de votaciones, análisis de texto o estadística descriptiva y modelos.", en: "Vote scaling, text analysis or descriptive statistics and models." } }
        - { title: { es: Visualización, en: Visualization }, text: { es: "Gráficos en ggplot2 pensados para publicación y prensa.", en: "ggplot2 charts designed for publication and press." } }
        - { title: { es: Publicación, en: Publication }, text: { es: "Punto de Referencia, nota de investigación o boletín, con datos replicables.", en: "A policy paper, research note or bulletin, with replicable data." } }
      did:
        - { title: { es: Escalamiento de votaciones, en: Vote scaling }, text: { es: "Análisis de las votaciones del Consejo Constitucional con escalamiento tipo NOMINATE, que permite ubicar a cada consejero en dimensiones latentes y mostrar, por ejemplo, patrones de división dentro de un mismo bloque.", en: "Analysis of Constitutional Council votes with NOMINATE-style scaling, placing each member on latent dimensions and showing, for example, patterns of division within a single bloc." } }
        - { title: { es: Polarización y fragmentación, en: Polarization and fragmentation }, text: { es: "Indicadores comparados entre la Convención y la Cámara de Diputados para los Puntos de Referencia del CEP.", en: "Comparative indicators between the Convention and the Chamber of Deputies for CEP's policy papers." } }
        - { title: { es: Análisis de texto y prensa, en: Text and press analysis }, text: { es: "Procesamiento de discursos, documentos y cobertura de prensa como datos, para seguir cómo se instalaban los temas.", en: "Processing speeches, documents and press coverage as data, to track how topics took hold." } }
        - { title: { es: Encuestas y opinión pública, en: Surveys and public opinion }, text: { es: "Explotación de encuestas propias y externas para caracterizar apruebo y rechazo, expectativas y desconfianza.", en: "Analysis of in-house and external surveys to characterize approval and rejection, expectations and distrust." } }
        - { title: { es: Voces del CEP, en: Voces del CEP }, text: { es: "Edición y publicación del boletín entre 2023 y 2024, con el seguimiento del segundo proceso constitucional.", en: "Editing and publishing the bulletin in 2023 and 2024, tracking the second constitutional process." } }
      tools: [R, ggplot2, { es: Escalamiento de votaciones, en: Vote scaling }, { es: Análisis de texto, en: Text analysis }, { es: Encuestas, en: Surveys }]
      links:
        - { label: { es: Sitio de C22, en: C22 website }, url: "https://c22cepchile.cl/" }
        - { label: { es: Publicaciones del CEP, en: CEP publications }, url: "https://www.cepchile.cl/" }


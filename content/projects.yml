lab:
  - id: visor-arriendos
    detail: true
    slug: { es: visor-de-arriendos, en: rental-finder }
    year: 2026
    title: { es: Visor de arriendos, en: Rental finder }
    hook:
      es: Buscar departamento en Santiago se había vuelto un segundo trabajo. Así que armé un sistema que revisa los portales cada mañana y me dice cuáles avisos valen la pena.
      en: Apartment hunting in Santiago had become a second job. So I built a system that checks the listing sites every morning and tells me which listings are worth it.
    facts:
      - { es: "Esta mañana revisó {live_total} avisos y {match} calzan con todo lo que buscamos.", en: "This morning it checked {live_total} listings and {match} match everything we want." }
      - { es: "Junta tres portales, elimina duplicados y ubica cada aviso en el mapa con su distancia al metro.", en: "It merges three listing sites, removes duplicates and maps every listing with its distance to the metro." }
      - { es: Se actualiza solo a las 10 de la mañana y guarda 30 días de historia., en: It updates itself at 10 a.m. and keeps 30 days of history. }
    tags: [Python, Playwright, Leaflet, OpenStreetMap, launchd, GitHub Pages]
    image: projects/visor-arriendos/mapa
    address: langab.github.io/visor_arriendos
    status: { es: "En producción, se actualiza a diario", en: "Live, updated daily" }
    links:
      - { label: { es: Abrir el visor, en: Open the finder }, url: "https://langab.github.io/visor_arriendos/viewer/" }
      - { label: { es: Código en GitHub, en: Code on GitHub }, url: "https://github.com/Langab/visor_arriendos" }

  - id: buscador-trabajo
    detail: true
    slug: { es: buscador-de-trabajo, en: job-search-agents }
    year: 2026
    title: { es: "Mi búsqueda de trabajo, con agentes", en: "My job search, run by agents" }
    hook:
      es: Buscar trabajo es un embudo de datos. Cientos de ofertas, pocas que calzan y cada postulación pide un CV distinto. Lo convertí en un sistema de Claude Code que busca, puntúa, adapta mi CV y lleva la cuenta.
      en: A job search is a data funnel. Hundreds of openings, a few that fit, and every application wants a different CV. I turned it into a Claude Code system that searches, scores, tailors my CV and keeps track.
    facts:
      - { es: 468 ofertas de 311 empresas revisadas en 29 búsquedas., en: "468 openings from 311 companies reviewed across 29 search runs." }
      - { es: "Cada oferta recibe un puntaje de 0 a 100 en habilidades, experiencia, cultura y proyección.", en: "Each opening gets a 0–100 score on skills, experience, culture fit and career direction." }
      - { es: Un agente redacta el CV y la carta; otro los revisa antes de que yo los lea., en: One agent drafts the CV and cover letter; another reviews them before I read them. }
    tags: [Claude Code, Skills, { es: Subagentes, en: Subagents }, Python, TypeScript, GitHub Pages]
    image: projects/buscador-trabajo/visor
    address: langab.github.io/visor_trabajos
    status: { es: En uso, en: In use }

  - id: visor-salud
    detail: true
    slug: { es: 25-millones-de-pasos, en: 25-million-steps }
    year: 2026
    title: { es: 25 millones de pasos, en: 25 million steps }
    hook:
      es: Mi teléfono lleva nueve años contando mis pasos. Un domingo exporté todo, 1,2 GB de datos, para ver qué sabía de mí. El código queda abierto para que lo pruebes con los tuyos.
      en: My phone has been counting my steps for nine years. One Sunday I exported everything, 1.2 GB of data, to see what it knew about me. The code is open so you can try it with yours.
    facts:
      - { es: "2,74 millones de registros de cinco dispositivos, de 2017 a 2026.", en: "2.74 million records from five devices, 2017 to 2026." }
      - { es: Un script lee el XML línea a línea sin cargarlo entero en memoria., en: A script reads the XML line by line without loading it all into memory. }
      - { es: "Puedes probarlo en esta página: tus datos no salen de tu navegador.", en: "You can try it on this page: your data never leaves your browser." }
    tags: [Python, pandas, SVG, Web Workers, Claude Code]
    image: projects/visor-salud/pasos
    address: langab.github.io/pagina_web_lang/proyectos/25-millones-de-pasos
    status: { es: "Código abierto, pruébalo con tus datos", en: "Open code, try it with your data" }

  - id: casa-siempre-gana
    detail: true
    slug: { es: la-casa-siempre-gana, en: the-house-always-wins }
    year: 2026
    title: { es: La casa siempre gana, en: The house always wins }
    hook:
      es: Un amigo me pidió una app para anotar sus apuestas y saber si iba ganando. Se la hice. Lo que no le prometí fue que la respuesta le iba a gustar.
      en: A friend asked me for an app to log his bets and tell him whether he was winning. I built it. What I didn't promise was that he'd like the answer.

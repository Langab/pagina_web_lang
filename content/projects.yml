  - id: fondecyt-bc
    home: true
    area: [research]
    years: "2024 – 2025"
    title: { es: "Gobernar la incertidumbre: el Banco Central en la crisis de 1982", en: "Governing uncertainty: Chile's Central Bank in the 1982 crisis" }
    org: { es: "Fondecyt N° 1231356, Universidad Diego Portales", en: "Fondecyt grant 1231356, Universidad Diego Portales" }
    role: { es: Investigador, en: Researcher }
    preview: projects/fondecyt-bc/red.jpg
    modal:
      intro:
        es: "El proyecto estudia cómo el Banco Central de Chile produce «estabilidad» económica. Mi parte fue la crisis de 1981 a 1983: convertir tres años de actas del Comité Ejecutivo en una base codificada y analizable, y describir con ella qué problemas discutía el Banco, qué acciones tomaba y a quién iban dirigidas."
        en: "The project studies how Chile's Central Bank produces economic \"stability\". My part covered the 1981–1983 crisis: turning three years of Executive Committee minutes into a coded, analyzable dataset, and using it to describe which problems the Bank discussed, which actions it took and who those actions targeted."
      cover:
        src: projects/fondecyt-bc/red.jpg
        alt: { es: Red de co-ocurrencia de problemas, en: Co-occurrence network of problems }
        caption: { es: "Red de co-ocurrencia: cada nodo es una categoría y cada enlace, dos categorías que aparecen en el mismo memorándum. Los colores son las comunidades detectadas con el algoritmo de Louvain.", en: "Co-occurrence network: each node is a category and each link, two categories appearing in the same memo. Colors are the communities detected with the Louvain algorithm." }
      numbers:
        - { value: 144, label: { es: "actas del Comité Ejecutivo (1981, 1982 y 1983)", en: "Executive Committee minutes (1981, 1982, 1983)" } }
        - { value: 1467, label: { es: memorandos codificados como unidad de análisis, en: memos coded as the unit of analysis } }
        - { value: 885, label: { es: memorandos vinculados a la crisis, en: memos linked to the crisis } }
        - { value: 3, label: { es: comunidades detectadas en la red de códigos, en: communities detected in the code network } }
      flow_title: { es: "El procesamiento, paso a paso", en: "The pipeline, step by step" }
      flow:
        - { title: { es: Digitalización, en: Digitization }, text: { es: Actas escaneadas convertidas a texto y segmentadas en memorandos con código único., en: Scanned minutes converted to text and segmented into memos with a unique code. } }
        - { title: { es: Esquema de códigos, en: Coding scheme }, text: { es: "Categorías construidas desde la literatura y desde el propio corpus, luego consolidadas.", en: "Categories built from the literature and from the corpus itself, then consolidated." } }
        - { title: { es: Clasificación con GPT-4o, en: Classification with GPT-4o }, text: { es: "Cada memorándum recibe un problema, una acción normativa y una entidad destinataria.", en: "Each memo receives a problem, a normative action and a target entity." } }
        - { title: { es: Análisis de redes, en: Network analysis }, text: { es: "Red de co-ocurrencia entre códigos, medidas de centralidad y comunidades con Louvain.", en: "Co-occurrence network across codes, centrality measures and Louvain communities." } }
        - { title: { es: Tópicos y lectura cualitativa, en: Topics and close reading }, text: { es: "Modelos estructurales de tópicos (STM) por comunidad y lectura de los discursos del Boletín Mensual entre octubre de 1981 y diciembre de 1983.", en: "Structural topic models (STM) per community and close reading of the Monthly Bulletin speeches from October 1981 to December 1983." } }
      bars:
        - title: { es: "Qué discutía el Banco: problemas por memorándum", en: "What the Bank discussed: problems per memo" }
          items:
            - { label: { es: "Inversión, comercio exterior y divisas", en: "Investment, foreign trade and currency" }, value: 226 }
            - { label: { es: Normativas y legislación cambiaria, en: Currency regulation and legislation }, value: 150 }
            - { label: { es: Manejo de deudas y créditos internos, en: Domestic debt and credit management }, value: 143 }
            - { label: { es: "Supervisión, regulación y sanciones", en: "Supervision, regulation and sanctions" }, value: 127 }
            - { label: { es: Financiamiento productivo, en: Productive financing }, value: 73 }
            - { label: { es: Otros seis problemas, en: Six other problems }, value: 166 }
          note: { es: "Distribución de los 885 memorandos ligados a la crisis entre las diez categorías del esquema.", en: "Distribution of the 885 crisis-related memos across the ten categories of the scheme." }
        - title: { es: "A quién se dirigía: entidades mencionadas", en: "Who was addressed: entities mentioned" }
          items:
            - { label: { es: El propio Banco Central, en: The Central Bank itself }, value: 467 }
            - { label: { es: Instituciones públicas, en: Public institutions }, value: 291 }
            - { label: { es: Bancos privados, en: Private banks }, value: 204 }
            - { label: { es: Empresas privadas, en: Private companies }, value: 191 }
            - { label: { es: Personas naturales, en: Individuals }, value: 185 }
            - { label: { es: Otras doce entidades, en: Twelve other entities }, value: 386 }
          note: { es: "Las acciones más frecuentes fueron autorizar (453), informar (322) y modificar (311), sobre un total de 2.692 acciones codificadas.", en: "The most frequent actions were authorizing (453), informing (322) and modifying (311), out of 2,692 coded actions." }
      did:
        - { title: { es: Pipeline de clasificación, en: Classification pipeline }, text: { es: "Diseñé el prompt, las diez categorías de problemas y los controles para codificar 1.467 memorandos de forma consistente con la API de OpenAI.", en: "I designed the prompt, the ten problem categories and the checks to code 1,467 memos consistently through the OpenAI API." } }
        - { title: { es: Medidas de red, en: Network measures }, text: { es: "Grado, intermediación, cercanía y centralidad de autovector para identificar qué categorías articulan el discurso normativo.", en: "Degree, betweenness, closeness and eigenvector centrality to identify which categories hold the normative discourse together." } }
        - { title: { es: Comunidades y tópicos, en: Communities and topics }, text: { es: "Detección de comunidades con Louvain y un modelo STM por comunidad, eligiendo el número de tópicos por coherencia semántica, exclusividad y verosimilitud.", en: "Louvain community detection plus one STM per community, choosing the number of topics by semantic coherence, exclusivity and held-out likelihood." } }
        - { title: { es: Gráficos y entregas, en: Charts and deliverables }, text: { es: "Frecuencias, redes y tablas de centralidad para el equipo, en dos entregas de método y resultados preliminares (mayo y julio de 2025).", en: "Frequencies, networks and centrality tables for the team, in two method and preliminary-results presentations (May and July 2025)." } }

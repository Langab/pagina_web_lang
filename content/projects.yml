work:
  - id: censo-2024
    area: [public]
    years: "2024 – 2025"
    title: { es: Censo de Población y Vivienda 2024, en: 2024 Population and Housing Census }
    org: { es: Instituto Nacional de Estadísticas (INE), en: National Statistics Institute of Chile (INE) }
    role: { es: Analista metodológico senior, en: Senior methods analyst }
    preview: logos/censo_2024.svg
    modal:
      intro:
        es: Contar a todo un país es la parte fácil de explicar. Lo difícil es que 18 millones de respuestas lleguen limpias y coherentes a las tablas finales. Trabajé en el equipo de procesamiento del INE, dentro del código en R que lleva cada dato desde la recolección hasta los indicadores.
        en: Counting an entire country is the easy part to explain. The hard part is getting 18 million answers to the final tables clean and consistent. I worked on INE's processing team, inside the R codebase that carries every data point from collection to indicators.
      numbers:
        - { value: 18480432, label: { es: personas censadas en el resultado oficial, en: people counted in the official result } }
        - { value: 10, label: { es: etapas de procesamiento entre la integración y los tabulados, en: processing stages from integration to final tables } }
        - { value: 14, suffix: "%", label: { es: "tiene 65 años o más; en 1992 era 6,6%", en: "are 65 or older, up from 6.6% in 1992" } }
      flow_title: { es: Así viaja un dato, en: How a data point travels }
      flow:
        - { title: { es: Integración, en: Integration }, text: { es: "Respuestas en tablet, web y papel en una sola base.", en: "Tablet, web and paper answers merged into one database." } }
        - { title: { es: Codificación, en: Coding }, text: { es: Respuestas abiertas asignadas a códigos con diccionarios., en: Open answers matched to codes with dictionaries. } }
        - { title: { es: Validación, en: Validation }, text: { es: Reglas que detectan valores imposibles o incoherentes., en: Rules that catch impossible or inconsistent values. } }
        - { title: { es: Edición e imputación, en: Editing and imputation }, text: { es: Corregir y completar con métodos documentados., en: Fixing and filling in with documented methods. } }
        - { title: { es: Indicadores, en: Indicators }, text: { es: Tabulados y comparaciones con censos anteriores., en: Tables and comparisons with past censuses. } }
      did:
        - { title: { es: "Sexo, edad y parentesco", en: "Sex, age and relationship" }, text: { es: "Escribí y corregí reglas en R para validar y completar las variables básicas de cada persona. Por ejemplo, inferir el sexo a partir del nombre cuando faltaba.", en: "I wrote and fixed R rules to validate and fill in each person's core variables. For example, inferring sex from the first name when it was missing." } }
        - { title: { es: Informes de calidad, en: Quality reports }, text: { es: Reportes en R Markdown para revisar la edad y comparar escenarios de edición antes de decidir., en: R Markdown reports to review age data and compare editing scenarios before deciding. } }
        - { title: { es: Comparar con la historia, en: Checking against history }, text: { es: "Indicadores demográficos para contrastar el Censo 2024 con los de 2017, 2002 y 1992.", en: "Demographic indicators to compare the 2024 Census with those of 2017, 2002 and 1992." } }
        - { title: { es: Cuestionarios en papel, en: Paper questionnaires }, text: { es: Variables del formulario en papel y codificación automática de respuestas abiertas., en: Paper form variables and automatic coding of open answers. } }
      tools: [R, R Markdown, renv, GitLab]
      note: { es: "El código y los microdatos son del INE y no se publican. Las cifras son las oficiales de [censo2024.ine.gob.cl](https://censo2024.ine.gob.cl/).", en: "The code and microdata belong to INE and aren't public. Figures are the official ones from [censo2024.ine.gob.cl](https://censo2024.ine.gob.cl/)." }
      links:
        - { label: { es: Resultados del Censo, en: Census results }, url: "https://censo2024.ine.gob.cl/" }

  - id: fondecyt-bc
    area: [research]
    years: "2024 – 2025"
    title: { es: "Gobernar la incertidumbre: el Banco Central en la crisis de 1982", en: "Governing uncertainty: Chile's Central Bank in the 1982 crisis" }
    org: { es: "Fondecyt N° 1231356, Universidad Diego Portales", en: "Fondecyt grant 1231356, Universidad Diego Portales" }
    role: { es: Investigador, en: Researcher }
    preview: projects/fondecyt-bc/red.jpg
    modal:
      intro:
        es: ¿Qué hace un banco central cuando todo se viene abajo? El proyecto estudia cómo el Banco Central de Chile produce «estabilidad». Mi parte fue la crisis de 1981 a 1983. Leímos, con ayuda de modelos de lenguaje, todo lo que discutía cada semana su Comité Ejecutivo.
        en: What does a central bank do when everything falls apart? The project studies how Chile's Central Bank produces "stability". My part was the 1981–1983 crisis. With help from language models, we read everything its Executive Committee discussed week after week.
      cover:
        src: projects/fondecyt-bc/red.jpg
        alt: { es: "Red de co-ocurrencia de problemas, acciones y destinatarios en las actas", en: "Co-occurrence network of problems, actions and targets in the minutes" }
        caption: { es: "Red de códigos que aparecen juntos en un mismo memorando. Cada color es una comunidad detectada con el algoritmo de Louvain.", en: "Network of codes that appear together in the same memo. Each color is a community detected with the Louvain algorithm." }
      numbers:
        - { value: 144, label: { es: actas del Comité Ejecutivo entre 1981 y 1983, en: Executive Committee minutes from 1981 to 1983 } }
        - { value: 1467, label: { es: memorandos codificados uno por uno, en: memos coded one by one } }
        - { value: 885, label: { es: memorandos ligados directamente a la crisis, en: memos directly tied to the crisis } }
        - { value: 23, label: { es: tipos de acción del Banco en el esquema de códigos, en: types of Bank action in the coding scheme } }
      flow_title: { es: "El método, paso a paso", en: "The method, step by step" }
      flow:
        - { title: { es: Del papel al texto, en: From paper to text }, text: { es: Actas escaneadas convertidas a texto con OCR., en: Scanned minutes converted to text with OCR. } }
        - { title: { es: Codificar con GPT-4o, en: Coding with GPT-4o }, text: { es: "Cada memorando recibe un problema, una acción y un destinatario.", en: "Each memo gets a problem, an action and a target." } }
        - { title: { es: Filtrar la crisis, en: Filtering the crisis }, text: { es: Un filtro de relevancia separa lo ligado a la crisis., en: A relevance filter keeps what relates to the crisis. } }
        - { title: { es: Redes, en: Networks }, text: { es: "Co-ocurrencias, centralidad y comunidades.", en: "Co-occurrence, centrality and communities." } }
        - { title: { es: Temas y lectura fina, en: Topics and close reading }, text: { es: Modelos de tópicos (STM) por grupo y lectura cualitativa con discursos de la época., en: Topic models (STM) per group and close reading alongside speeches from the period. } }
      did:
        - { title: { es: Un piloto en 2024, en: A pilot in 2024 }, text: { es: "Un notebook en Python con GPT-3.5 que resumía cada acta y extraía personas, problemas, sanciones y políticas.", en: "A Python notebook with GPT-3.5 that summarized each set of minutes and pulled out people, problems, sanctions and policies." } }
        - { title: { es: El pipeline de 2025, en: The 2025 pipeline }, text: { es: "Prompts, categorías y controles para codificar 1.467 memorandos de forma consistente con GPT-4o.", en: "Prompts, categories and checks to code 1,467 memos consistently with GPT-4o." } }
        - { title: { es: Análisis de redes, en: Network analysis }, text: { es: "Qué problemas, acciones y actores aparecen juntos, y cuáles ocupan el centro.", en: "Which problems, actions and actors show up together, and which ones sit at the center." } }
        - { title: { es: Entregas al equipo, en: Team deliverables }, text: { es: Presentaciones de método y resultados preliminares en mayo y julio de 2025., en: Method and preliminary results presentations in May and July 2025. } }
      tools: [Python, OpenAI API, GPT-4o, R, STM, Louvain]
      note: { es: Los hallazgos del equipo aún no están publicados. Por eso aquí muestro el método y no las conclusiones., en: "The team's findings aren't published yet, so here I show the method, not the conclusions." }

  - id: aldeas
    area: [ngo, consulting]
    years: { es: "2025 – hoy", en: "2025 – now" }
    title: { es: Habilidades digitales en Aldeas Infantiles SOS, en: "Digital skills at SOS Children's Villages" }
    org: { es: "Aldeas Infantiles SOS Chile, con MICELIA", en: "SOS Children's Villages Chile, with MICELIA" }
    role: { es: Consultor y líder de la sede Quilpué, en: Consultant and Quilpué site lead }
    preview: projects/aldeas/curvas.jpg
    modal:
      intro:
        es: ¿Qué tan preparados están los equipos y los jóvenes de Aldeas para una vida que pasa por el celular? Primero lo medimos. Ahora, en 2026, damos talleres para cerrar las brechas que encontramos.
        en: How ready are the staff and young people at SOS Children's Villages for a life that runs through a phone? First we measured it. Now, in 2026, we run workshops to close the gaps we found.
      cover:
        src: projects/aldeas/curvas.jpg
        alt: { es: "Lámina «Las dos curvas del placer» sobre recompensa digital y recompensa de la vida real", en: "Slide «The two pleasure curves» about digital reward versus real-life reward" }
        caption: { es: "Material de clase: por qué una app engancha más que la vida real y cómo recalibrar.", en: "Class material: why an app hooks you more than real life does, and how to recalibrate." }
      numbers:
        - { value: 4, label: { es: aldeas con grupos focales en el diagnóstico, en: villages with focus groups in the assessment } }
        - { value: 3, label: { es: sedes con talleres durante 2026, en: sites running workshops in 2026 } }
        - { value: 6, label: { es: sesiones por sede entre agosto y diciembre, en: sessions per site from August to December } }
      flow_title: { es: Del diagnóstico al taller, en: From assessment to workshop }
      flow:
        - { title: { es: Medir, en: Measure }, text: { es: Encuesta basada en el marco europeo DigComp 2.2 y grupos focales., en: Survey based on the European DigComp 2.2 framework plus focus groups. } }
        - { title: { es: Ajustar, en: Adjust }, text: { es: Puntajes corregidos por el uso real de herramientas para evitar la autoevaluación inflada., en: Scores corrected by actual tool use to avoid inflated self-ratings. } }
        - { title: { es: Diseñar, en: Design }, text: { es: Clases con una meta de conducta concreta y repaso espaciado., en: Classes with one concrete behavioral goal and spaced review. } }
        - { title: { es: Enseñar, en: Teach }, text: { es: Talleres para jóvenes de 13 a 18 años y para cuidadores., en: Workshops for young people aged 13 to 18 and for caregivers. } }
        - { title: { es: Evaluar, en: Evaluate }, text: { es: Se repite la encuesta en diciembre para medir el avance., en: The survey is repeated in December to measure progress. } }
      gallery:
        - { src: projects/aldeas/trampa.jpg, caption: { es: "Infografía «La trampa está diseñada», sobre cómo las apps capturan la atención.", en: "Infographic «The trap is designed», on how apps capture attention." } }
      tools: [Microsoft Forms, Excel, Python, PowerPoint]
      note: { es: Los resultados del diagnóstico pertenecen a Aldeas Infantiles SOS Chile y no se publican aquí., en: The assessment results belong to SOS Children's Villages Chile and aren't published here. }


      tools: [Python, OpenAI API, GPT-4o, R, STM, Louvain, igraph]
      note: { es: "Las conclusiones interpretativas del equipo aún no están publicadas: aquí muestro el método y la descripción del corpus codificado.", en: "The team's interpretive conclusions aren't published yet: what I show here is the method and a description of the coded corpus." }

  - id: prieto
    home: true
    area: [research]
    years: { es: "2025 – hoy", en: "2025 – now" }
    title: { es: "Inseguridad económica y participación en protesta", en: "Economic insecurity and protest participation" }
    org: { es: Investigación con Joaquín Prieto, en: Research with Joaquín Prieto }
    role: { es: "Analista cuantitativo y coautor", en: "Quantitative analyst and co-author" }
    modal:
      intro:
        es: "Dos investigaciones sobre inseguridad económica en Chile. En la primera, *Economic Insecurity, Not Inequality?*, construimos un índice multidimensional con datos de panel para explicar quién participó en las protestas de octubre de 2019. En la segunda, *Insecurity amid Recovery*, trabajamos la Encuesta de Bienestar Social del INE. Soy responsable del análisis cuantitativo y coautor del primer paper."
        en: "Two research projects on economic insecurity in Chile. In the first, *Economic Insecurity, Not Inequality?*, we built a multidimensional index from panel data to explain who took part in the October 2019 protests. In the second, *Insecurity amid Recovery*, we work with INE's Social Wellbeing Survey. I am responsible for the quantitative analysis and a co-author of the first paper."
      numbers:
        - { value: 8, label: { es: "olas del panel ELSOC procesadas (2016–2023)", en: "ELSOC panel waves processed (2016–2023)" } }
        - { value: 4, label: { es: "subdimensiones del índice de inseguridad económica", en: "sub-dimensions of the economic insecurity index" } }
        - { value: 9, label: { es: modelos anidados estimados y comparados, en: nested models estimated and compared }  }
        - { value: 3, label: { es: definiciones del resultado puestas a prueba, en: outcome definitions tested } }
      flow_title: { es: Cómo se construye el análisis, en: How the analysis is built }
      flow:
        - { title: { es: Panel, en: Panel }, text: { es: "Preparación de ELSOC 2016–2023: selección de variables, consistencia entre olas y verificación de la muestra longitudinal.", en: "Preparing ELSOC 2016–2023: variable selection, consistency across waves and checks on the longitudinal sample." } }
        - { title: { es: Índice, en: Index }, text: { es: "Índice de inseguridad económica con cuatro subdimensiones: sobrecarga financiera, endeudamiento, precariedad laboral y vulnerabilidad económica.", en: "Economic insecurity index with four sub-dimensions: financial strain, debt, labor precarity and economic vulnerability." } }
        - { title: { es: Resultado, en: Outcome }, text: { es: "Definición y comparación de tres formas de medir la participación en protesta, desde la agregada hasta las acciones de mayor costo.", en: "Defining and comparing three ways of measuring protest participation, from the aggregate to the costlier forms of action." } }
        - { title: { es: Modelos, en: Models }, text: { es: "Regresiones logísticas por bloques, diagnóstico de valores perdidos e imputación múltiple para probar la robustez.", en: "Block-wise logistic regressions, missing-data diagnostics and multiple imputation to test robustness." } }
        - { title: { es: Mediación, en: Mediation }, text: { es: "Análisis de mediación para distinguir si la desconfianza institucional es un canal intermedio o paralelo.", en: "Mediation analysis to tell whether institutional distrust is an intermediate or a parallel channel." } }
      did:
        - { title: { es: Código reproducible, en: Reproducible code }, text: { es: "Scripts en R numerados por etapa, con resultados exportados a Excel para que el equipo pueda revisarlos sin abrir el código.", en: "R scripts numbered by stage, with results exported to Excel so the team can review them without opening the code." } }
        - { title: { es: Decisiones metodológicas documentadas, en: Documented methodological decisions }, text: { es: "Memos de método y bitácora del proyecto, donde queda escrito qué se probó, qué se descartó y por qué.", en: "Method memos and a project log recording what was tried, what was discarded and why." } }
        - { title: { es: Resultados negativos incluidos, en: Negative results included }, text: { es: "Las hipótesis que no se sostuvieron se reportan igual: un resultado nulo también es información para el paper.", en: "Hypotheses that didn't hold are reported as well: a null result is information for the paper too." } }
        - { title: { es: Figuras y presentaciones, en: Figures and presentations }, text: { es: "Gráficos de probabilidades predichas y de efectos por subdimensión para las presentaciones del equipo.", en: "Predicted-probability and sub-dimension effect plots for the team's presentations." } }
      tools: [R, ELSOC, { es: Encuesta de Bienestar Social, en: Social Wellbeing Survey }, { es: Imputación múltiple, en: Multiple imputation }, { es: Análisis de mediación, en: Mediation analysis }]
      note: { es: "Ambos papers están en preparación, así que aquí muestro el método y mi rol, no los resultados.", en: "Both papers are in progress, so what I show here is the method and my role, not the results." }

  - id: lectura-digital
    area: [consulting, research]
    years: "2024"
    title: { es: "¿Quién lee en las bibliotecas digitales de Chile?", en: "Who reads in Chile's digital libraries?" }
    org: { es: "Gobernanza de la lectura digital en Chile, Fondo del Libro", en: "Governance of digital reading in Chile, Fondo del Libro" }
    role: { es: Analista cuantitativo, en: Quantitative analyst }
    preview: projects/lectura-digital/regiones.jpg
    modal:
      intro:
        es: El Estado tiene dos bibliotecas digitales, una para escuelas y otra para todo público. Con datos pedidos por Ley de Transparencia medí quién las usa, desde qué dispositivo y a dónde no están llegando.
        en: Chile's government runs two digital libraries, one for schools and one for everyone. Using data obtained through freedom-of-information requests, I measured who uses them, on which devices and where they aren't reaching.
      numbers:
        - { value: 608978, label: { es: "usuarios de la Biblioteca Digital Escolar (2019–2022)", en: "School Digital Library users (2019–2022)" } }
        - { value: 464649, label: { es: "usuarios de la Biblioteca Pública Digital (2018–2022)", en: "Public Digital Library users (2018–2022)" } }
        - { value: 81, suffix: "%", label: { es: de la lectura en la biblioteca pública ocurre en el celular, en: of public library reading happens on a phone } }
      bars:
        title: { es: "Escuelas y la Biblioteca Digital Escolar", en: "Schools and the School Digital Library" }
        items:
          - { label: { es: Escuelas del país, en: Schools in Chile }, value: 16602, display: "16.602" }
          - { label: { es: La usaron al menos una vez, en: Used it at least once }, value: 7481, display: "7.481" }
          - { label: { es: Llegaron al 10% de su comunidad, en: Reached 10% of their community }, value: 476, display: "476" }
          - { label: { es: "De esas, rurales", en: "Of those, rural" }, value: 38, display: "38" }
        note: { es: Las escuelas más vulnerables y las rurales usan bastante menos la plataforma., en: More vulnerable and rural schools use the platform far less. }
      did:
        - { title: { es: Cinco años en una base, en: Five years in one dataset }, text: { es: "Préstamos por usuario y por título de 2018 a 2022, unidos y limpiados en R.", en: "Loans by user and by title from 2018 to 2022, joined and cleaned in R." } }
        - { title: { es: Cruce con Mineduc, en: Linking to education data }, text: { es: "Cada escuela enlazada con región, ruralidad, SIMCE, matrícula y vulnerabilidad.", en: "Each school linked to region, rurality, test scores, enrollment and vulnerability." } }
        - { title: { es: Índices propios, en: Custom indices }, text: { es: "Tipo de usuario, intensidad de uso, lectura e interés.", en: "User type, usage intensity, reading and interest." } }
        - { title: { es: Dashboard y recomendaciones, en: Dashboard and recommendations }, text: { es: Un tablero público de nueve páginas en Power BI y propuestas para medir mejor., en: A nine-page public Power BI dashboard and proposals for better measurement. } }
      gallery:
        - { src: projects/lectura-digital/regiones.jpg, caption: { es: Distribución de usuarios de la Biblioteca Digital Escolar por región., en: School Digital Library users by region. } }
        - { src: projects/lectura-digital/dispositivos.jpg, caption: { es: "Dispositivos de lectura en la Biblioteca Pública Digital.", en: "Reading devices in the Public Digital Library." } }
      tools: [R, Power BI, { es: Ley de Transparencia, en: FOI requests }]
      note: { es: "Mi parte fue la fase cuantitativa, entre abril y julio de 2024. La fase cualitativa estuvo a cargo de otra persona del equipo.", en: "My part was the quantitative phase, April to July 2024. Another team member led the qualitative phase." }

  - id: radiografia-equidad
    area: [consulting]
    years: "2024"
    title: { es: Radiografía a la Equidad Puertas Adentro, en: "An X-ray of equity at home" }
    org: { es: Consultoría para Francisca Bravo Cox, en: Consulting for Francisca Bravo Cox }
    role: { es: Consultor técnico, en: Technical consultant }
    modal:
      intro:
        es: ¿Cómo se organiza la plata en una pareja y qué le pasa a la carrera de cada uno cuando llegan los hijos? Francisca Bravo, abogada que trabaja estos temas, quería datos propios para responderlo. Yo me hice cargo de la parte técnica de la encuesta.
        en: How do couples handle money, and what happens to each partner's career when kids arrive? Francisca Bravo, a lawyer who works on these issues, wanted her own data to answer that. I handled the technical side of the survey.
      numbers:
        - { value: 1510, label: { es: respuestas en dos semanas de terreno, en: responses in two weeks of fieldwork } }
        - { value: 1273, label: { es: casos válidos después de limpiar la base, en: valid cases after cleaning } }
        - { value: 54, label: { es: preguntas en el cuestionario, en: questions in the questionnaire } }
        - { value: 61, label: { es: láminas en la presentación de resultados, en: slides in the results deck } }
      flow_title: { es: Cómo lo hicimos, en: How we did it }
      flow:
        - { title: { es: Cuestionario, en: Questionnaire }, text: { es: "Revisión de seis bloques: pareja, dinero cotidiano, carrera e hijos.", en: "Review of six blocks: partner, daily money, career and children." } }
        - { title: { es: Terreno, en: Fieldwork }, text: { es: "Encuesta online del 23 de abril al 7 de mayo de 2024.", en: "Online survey from April 23 to May 7, 2024." } }
        - { title: { es: Limpieza, en: Cleaning }, text: { es: Filtro a mujeres que viven con su pareja y control de consistencia., en: Filtered to women living with a partner and checked for consistency. } }
        - { title: { es: Análisis, en: Analysis }, text: { es: "Tablas cruzadas y pruebas de chi cuadrado en R y SPSS.", en: "Cross-tabs and chi-square tests in R and SPSS." } }
        - { title: { es: Respuestas abiertas, en: Open answers }, text: { es: Clasificación por tema con GPT-4 a través de la API., en: Topic classification with GPT-4 through the API. } }
      did:
        - { title: { es: Informe, en: Report }, text: { es: 25 páginas con resultados y lectura de los datos., en: 25 pages of results and interpretation. } }
        - { title: { es: Presentación, en: Deck }, text: { es: 61 láminas para comunicar los hallazgos., en: 61 slides to communicate the findings. } }
        - { title: { es: Base limpia, en: Clean dataset }, text: { es: Base de datos y tablas resumen listas para seguir trabajando., en: Dataset and summary tables ready for further work. } }
      tools: [R, SPSS, Python, OpenAI API]
      note: { es: "Muestra no probabilística, difundida por redes sociales. Los resultados pertenecen a la clienta.", en: "Non-probability sample spread through social media. The results belong to the client." }

  - id: aldeas
    area: [ngo, consulting]
    years: { es: "2025 – hoy", en: "2025 – now" }
    title: { es: Habilidades digitales en Aldeas Infantiles SOS, en: "Digital skills at SOS Children's Villages" }
    org: { es: "Aldeas Infantiles SOS Chile, con MICELIA", en: "SOS Children's Villages Chile, with MICELIA" }
    role: { es: Consultor y líder de la sede Quilpué, en: Consultant and Quilpué site lead }
    preview: projects/aldeas/curvas.jpg
    modal:
      intro:
        es: ¿Qué tan preparados están los equipos y los jóvenes de Aldeas para una vida que pasa por el celular? Primero lo medimos. Ahora, en 2026, damos talleres para cerrar las brechas que encontramos.
        en: How ready are the staff and young people at SOS Children's Villages for a life that runs through a phone? First we measured it. Now, in 2026, we run workshops to close the gaps we found.
      cover:
        src: projects/aldeas/curvas.jpg
        alt: { es: "Lámina «Las dos curvas del placer» sobre recompensa digital y recompensa de la vida real", en: "Slide «The two pleasure curves» about digital reward versus real-life reward" }
        caption: { es: "Material de clase: por qué una app engancha más que la vida real y cómo recalibrar.", en: "Class material: why an app hooks you more than real life does, and how to recalibrate." }
      numbers:
        - { value: 4, label: { es: aldeas con grupos focales en el diagnóstico, en: villages with focus groups in the assessment } }
        - { value: 3, label: { es: sedes con talleres durante 2026, en: sites running workshops in 2026 } }
        - { value: 6, label: { es: sesiones por sede entre agosto y diciembre, en: sessions per site from August to December } }
      flow_title: { es: Del diagnóstico al taller, en: From assessment to workshop }
      flow:
        - { title: { es: Medir, en: Measure }, text: { es: Encuesta basada en el marco europeo DigComp 2.2 y grupos focales., en: Survey based on the European DigComp 2.2 framework plus focus groups. } }
        - { title: { es: Ajustar, en: Adjust }, text: { es: Puntajes corregidos por el uso real de herramientas para evitar la autoevaluación inflada., en: Scores corrected by actual tool use to avoid inflated self-ratings. } }
        - { title: { es: Diseñar, en: Design }, text: { es: Clases con una meta de conducta concreta y repaso espaciado., en: Classes with one concrete behavioral goal and spaced review. } }
        - { title: { es: Enseñar, en: Teach }, text: { es: Talleres para jóvenes de 13 a 18 años y para cuidadores., en: Workshops for young people aged 13 to 18 and for caregivers. } }
        - { title: { es: Evaluar, en: Evaluate }, text: { es: Se repite la encuesta en diciembre para medir el avance., en: The survey is repeated in December to measure progress. } }
      gallery:
        - { src: projects/aldeas/trampa.jpg, caption: { es: "Infografía «La trampa está diseñada», sobre cómo las apps capturan la atención.", en: "Infographic «The trap is designed», on how apps capture attention." } }
      tools: [Microsoft Forms, Excel, Python, PowerPoint]
      note: { es: Los resultados del diagnóstico pertenecen a Aldeas Infantiles SOS Chile y no se publican aquí., en: The assessment results belong to SOS Children's Villages Chile and aren't published here. }


      - { es: 600 simulaciones por usuario para separar la suerte de la habilidad., en: 600 simulations per user to tell luck from skill. }
      - { es: "Sin librerías: HTML, JavaScript y gráficos SVG hechos a mano.", en: "No libraries: HTML, JavaScript and hand-made SVG charts." }
    tags: [JavaScript, SVG, Monte Carlo, Google Sheets, PWA]
    image: projects/casa-siempre-gana/simulador
    address: una-app-para-un-amigo.local
    status: { es: Uso privado, en: Private use }


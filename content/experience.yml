summary:
  es: |
    Soy sociólogo de la Universidad Diego Portales, titulado con distinción máxima y primero de mi generación. Me muevo entre la metodología cuantitativa, la investigación cualitativa y el código.

    Hoy trabajo como analista de datos en el Servicio Local de Educación Pública Santa Rosa. Antes validé datos del Censo 2024 en el INE, analicé el proceso constitucional en el CEP y codifiqué actas del Banco Central para un Fondecyt. Me gusta que un análisis termine en algo que otra persona pueda usar el lunes.
  en: |
    I'm a sociologist from Universidad Diego Portales, graduated with highest honors and first in my class. I work where quantitative methods, qualitative research and code meet.

    Today I'm a data analyst at Servicio Local de Educación Pública Santa Rosa, a public school district in southern Santiago. Before that I validated 2024 Census data at INE, analyzed Chile's constitutional process at CEP and coded Central Bank minutes for a Fondecyt research grant. I like analysis that ends in something another person can use on Monday.


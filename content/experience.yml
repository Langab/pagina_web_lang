headline: { es: "Sociólogo, analista de datos, monitoreo y evaluación, business intelligence", en: "Sociologist, data analyst, monitoring and evaluation, business intelligence" }

summary:
  es: |
    Soy sociólogo (Universidad Diego Portales, distinción máxima) y analista de datos, con más de 5 años de experiencia en sector público, investigación aplicada y consultoría. Tengo experiencia en procesamiento de datos a gran escala (Censo Nacional 2024, INE), monitoreo y evaluación de programas educativos (SLEP Santa Rosa), gobernanza de datos, tableros en Power BI y reportes automatizados en R.

    Soy coautor de publicaciones académicas y de política pública. Uso la IA de forma aplicada y responsable para automatizar procesos con datos sensibles, y comunico resultados con claridad a equipos directivos y audiencias no técnicas.
  en: |
    I'm a sociologist (Universidad Diego Portales, highest honors) and data analyst with more than 5 years of experience in the public sector, applied research and consulting. My experience covers large-scale data processing (2024 National Census, INE), monitoring and evaluation of education programs (SLEP Santa Rosa), data governance, Power BI dashboards and automated reports in R.

    I'm a co-author of academic and public policy publications. I use AI in an applied, responsible way to automate processes involving sensitive data, and I communicate results clearly to management teams and non-technical audiences.

target:
  kicker: { es: Rol que busco, en: Role I'm looking for }
  title: { es: "Analista de datos, BI o investigación aplicada", en: "Data analyst, BI or applied research" }
  text:
    es: "Cargos de análisis de datos, inteligencia de negocios o investigación aplicada, en instituciones públicas, centros de estudio o empresas que necesiten ordenar sus datos antes de decidir. Base en Santiago de Chile."
    en: "Roles in data analysis, business intelligence or applied research, in public institutions, think tanks or companies that need to organize their data before deciding. Based in Santiago, Chile."
  items:

    - { es: "Tableros e informes que se pueden volver a generar", en: "Dashboards and reports that can be regenerated" }
    - { es: "Gobernanza de datos y documentación", en: "Data governance and documentation" }
    - { es: "Diseño y análisis de encuestas", en: "Survey design and analysis" }

jobs:
  - id: slep
    current: true
    when: { es: "oct 2025 – actualidad", en: "Oct 2025 – present" }
    role: { es: Analista de datos, en: Data analyst }
    org: { es: "SLEP Santa Rosa, Departamento de Estudios, Monitoreo y Datos", en: "SLEP Santa Rosa, Studies, Monitoring and Data Department" }
    desc:
      es: "Lidero los flujos de datos de punta a punta (extracción, limpieza, transformación y visualización) de datos educacionales de múltiples escuelas públicas. Diseño y mantengo tableros interactivos en Power BI que los equipos directivos y educativos consultan cada semana, complementados con reportes automáticos mensuales construidos en R Markdown, Quarto y LaTeX. Proceso y analizo resultados educativos (SIMCE, PAES), matrícula, asistencia y trayectorias, y construyo indicadores de gestión y de implementación de programas. Construí e implementé desde cero el marco de gobernanza de datos de la organización: diccionario de datos, estándares de calidad y documentación de pipelines. Desarrollé una [página web institucional para la reportería de datos](https://datos.slepsantarosa.workers.dev/), y capacito a equipos en el uso de tableros y herramientas de datos."
      en: "I lead end-to-end data pipelines (extraction, cleaning, transformation and visualization) for education data from multiple public schools. I design and maintain interactive Power BI dashboards that management and teaching teams check every week, complemented by automatic monthly reports built in R Markdown, Quarto and LaTeX. I process and analyze education results (SIMCE, PAES), enrollment, attendance and student pathways, and I build indicators for management and program implementation. I built and implemented the organization's data governance framework from scratch: data dictionary, quality standards and pipeline documentation. I developed an [institutional website for data reporting](https://datos.slepsantarosa.workers.dev/), and I train teams to use dashboards and data tools."
  - id: ine
    when: { es: "jun 2024 – abr 2025", en: "Jun 2024 – Apr 2025" }
    role: { es: Analista metodológico senior, en: Senior methods analyst }
    org: { es: "INE Chile, Censo de Población y Vivienda 2024", en: "INE Chile, 2024 Population and Housing Census" }
    desc:
      es: "Procesé y validé microdatos a gran escala para el Censo Nacional. Diseñé pipelines automatizados de control de calidad estadística. Elaboré reportes técnicos y briefs analíticos que se usaron directamente para la planificación estratégica institucional y la difusión pública. Participé en el diseño del cuestionario censal y en el análisis de pruebas preparativas, siguiendo estándares internacionales."
      en: "I processed and validated large-scale microdata for the National Census. I designed automated statistical quality control pipelines. I wrote technical reports and analytical briefs used directly for institutional strategic planning and public communication. I took part in designing the census questionnaire and analyzing its preparatory tests, following international standards."
  - id: fondecyt-bc
    parallel: true
    when: { es: "may 2024 – ago 2025", en: "May 2024 – Aug 2025" }
    role: { es: "Investigador, analista de datos", en: "Researcher, data analyst" }
    org: { es: Fondecyt N° 1231356, en: Fondecyt grant 1231356 }
    desc:
      es: "Estructuré y analicé un corpus longitudinal de 16 años de documentos de política económica (2006–2022) con métodos mixtos: codificación cuantitativa y análisis cualitativo. Gestioné el control de versiones y la documentación de datos en Git, para asegurar la reproducibilidad del pipeline de investigación. Entregué datasets estructurados y resúmenes analíticos para publicación académica revisada por pares."
      en: "I structured and analyzed a 16-year longitudinal corpus of economic policy documents (2006–2022) using mixed methods: quantitative coding and qualitative analysis. I managed version control and data documentation in Git to keep the research pipeline reproducible. I delivered structured datasets and analytical summaries for peer-reviewed publication."
  - id: voces
    when: { es: "abr 2023 – abr 2024", en: "Apr 2023 – Apr 2024" }
    role: { es: "Asistente de investigación, análisis estadístico", en: "Research assistant, statistical analysis" }
    org: Centro de Estudios Públicos (CEP)
    desc:
      es: "Sistematicé datos electorales y de opinión pública (Encuesta CEP, votaciones constitucionales 2023): limpieza, codificación y análisis descriptivo e inferencial. Elaboré el boletín *Voces del CEP*, traduciendo hallazgos de encuestas complejas en narrativas accesibles para audiencias de política pública."
      en: "I systematized electoral and public opinion data (CEP Survey, 2023 constitutional votes): cleaning, coding, and descriptive and inferential analysis. I produced the *Voces del CEP* bulletin, turning complex survey findings into accessible narratives for public policy audiences."
  - id: c22
    when: { es: "ago 2021 – abr 2024", en: "Aug 2021 – Apr 2024" }
    role: { es: "Asistente de investigación C22, humanidades digitales", en: "C22 research assistant, digital humanities" }
    org: { es: "CEP, proyecto C22", en: "CEP, C22 project" }
    desc:
      es: "Apliqué minería de texto y análisis de redes a grandes colecciones de documentos políticos para investigación socio-constitucional. Analicé los resultados educativos de los Servicios Locales de Educación Pública (SLEP) y el SIMCE de sus establecimientos, con minutas y reportes de investigación. Coautor de 13 publicaciones académicas basadas en análisis cuantitativo y computacional de datos legislativos y constitucionales."
      en: "I applied text mining and network analysis to large collections of political documents for socio-constitutional research. I analyzed the education results of the Local Public Education Services (SLEP) and the SIMCE scores of their schools, with briefs and research reports. Co-author of 13 academic publications based on quantitative and computational analysis of legislative and constitutional data."
  - id: tironi
    when: { es: "ago 2021 – mar 2023", en: "Aug 2021 – Mar 2023" }
    role: { es: Analista de asuntos públicos, en: Public affairs analyst }
    org: Tironi y Asociados
    desc:
      es: "Recopilé, limpié y analicé datos políticos y electorales para el Boletín Constitucional 2022 y proyectos de consultoría estratégica. Entregué diagnósticos basados en datos en contextos políticos de alta velocidad."
      en: "I collected, cleaned and analyzed political and electoral data for the 2022 Constitutional Bulletin and strategic consulting projects. I delivered data-based assessments in fast-moving political contexts."

# `project` es el id en projects.yml, para el enlace a su página.
personal:
  cta: { es: Ver el proyecto, en: See the project }
  items:
    - project: buscador-trabajo
      current: true
      when: { es: "jul 2026 – actualidad", en: "Jul 2026 – present" }
      title: { es: Asistente de búsqueda de empleo con agentes de IA, en: Job-search assistant with AI agents }
      org: { es: Proyecto personal, en: Personal project }
      desc:
        es: "Adapté al mercado chileno un framework open-source de agentes sobre Claude Code, creado para Dinamarca: la IA evalúa el encaje con cada oferta, redacta un CV adaptado en Word y lo revisa contra un checklist. Construí scrapers para Empleos Públicos (API interna), más de 25 centros de estudios y el muro de LinkedIn, además de un visor web público de ofertas publicado en GitHub Pages. En tres meses procesé más de 500 ofertas y 33 postulaciones con CV adaptado. Diseñé reglas que impiden a la IA afirmar experiencia que no se pueda defender en una entrevista."
        en: "I adapted to the Chilean market an open-source agent framework on Claude Code, originally built for Denmark: the AI assesses the fit with each opening, drafts a tailored CV in Word and checks it against a checklist. I built scrapers for Empleos Públicos (its internal API), more than 25 think tanks and the LinkedIn feed, plus a public job viewer published on GitHub Pages. In three months I processed more than 500 openings and 33 applications with a tailored CV. I designed rules that stop the AI from claiming experience that couldn't be defended in an interview."


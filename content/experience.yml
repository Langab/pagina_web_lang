headline: { es: "Analista de datos, business intelligence y análisis estadístico", en: "Data analyst, business intelligence and statistical analysis" }

summary:
  es: |
    Soy analista de datos, con más de 5 años de experiencia en organizaciones del sector público, el privado y la investigación académica. Manejo R, Power BI y Excel a nivel avanzado, y tengo bases sólidas en Python y control de versiones con Git.

    He armado flujos de datos de punta a punta, tableros interactivos y modelos estadísticos para proyectos de gran escala, incluido el Censo Nacional de Chile 2024, y explico los resultados con claridad a audiencias no técnicas.
  en: |
    I'm a data analyst with more than 5 years of experience in public sector, private sector and academic research organizations. I work with R, Power BI and Excel at an advanced level, with a solid base in Python and version control with Git.

    I've built end-to-end data pipelines, interactive dashboards and statistical models for large-scale projects, including Chile's 2024 National Census, and I explain results clearly to non-technical audiences.

target:
  kicker: { es: Rol que busco, en: Role I'm looking for }
  title: { es: "Analista de datos, BI o investigación aplicada", en: "Data analyst, BI or applied research" }
  text:
    es: "Cargos de análisis de datos, inteligencia de negocios o investigación aplicada, en instituciones públicas, centros de estudio o empresas que necesiten ordenar sus datos antes de decidir. Base en Santiago de Chile."
    en: "Roles in data analysis, business intelligence or applied research, in public institutions, think tanks or companies that need to organize their data before deciding. Based in Santiago, Chile."
  items:
    - { es: "Procesamiento y validación de datos a gran escala", en: "Large-scale data processing and validation" }
    - { es: "Tableros e informes que se pueden volver a generar", en: "Dashboards and reports that can be regenerated" }
    - { es: "Gobernanza de datos y documentación", en: "Data governance and documentation" }
    - { es: "Diseño y análisis de encuestas", en: "Survey design and analysis" }

jobs:
  - id: slep
    current: true
    when: { es: "oct 2025 – actualidad", en: "Oct 2025 – present" }
    role: { es: Analista de datos, en: Data analyst }
    org: { es: "SLEP Santa Rosa, Departamento de Estudios, Monitoreo y Datos", en: "SLEP Santa Rosa, Studies, Monitoring and Data Department" }
    desc:
      es: "Lidero flujos de datos de punta a punta (extracción, limpieza, transformación y visualización) para datos educacionales de múltiples escuelas. Diseño y mantengo tableros interactivos en Power BI que los equipos directivos y educativos consultan cada semana, complementados con reportes automáticos mensuales construidos en R Markdown, Quarto y LaTeX. Construí e implementé desde cero el marco de gobernanza de datos de la organización: diccionario de datos, estándares de calidad y documentación de pipelines. También construí la [página web institucional para reportería de datos](https://datos.slepsantarosa.workers.dev/)."
      en: "I lead end-to-end data pipelines (extraction, cleaning, transformation and visualization) for education data from multiple schools. I design and maintain interactive Power BI dashboards that management and teaching teams check every week, complemented by automatic monthly reports built in R Markdown, Quarto and LaTeX. I built and implemented the organization's data governance framework from scratch: data dictionary, quality standards and pipeline documentation. I also built the [institutional website for data reporting](https://datos.slepsantarosa.workers.dev/)."
  - id: ine
    when: { es: "jun 2024 – abr 2025", en: "Jun 2024 – Apr 2025" }
    role: { es: Analista metodológico senior, en: Senior methods analyst }
    org: { es: "INE Chile, Censo de Población y Vivienda 2024", en: "INE Chile, 2024 Population and Housing Census" }
    desc:
      es: "Procesé y validé microdatos a gran escala para el Censo Nacional. Diseñé pipelines automatizados de control de calidad estadística. Elaboré reportes técnicos y briefs analíticos que se usaron directamente para la planificación estratégica institucional y la difusión pública."
      en: "I processed and validated large-scale microdata for the National Census. I designed automated statistical quality control pipelines. I wrote technical reports and analytical briefs used directly for institutional strategic planning and public communication."
  - id: fondecyt-bc
    parallel: true
    when: { es: "may 2024 – ago 2025", en: "May 2024 – Aug 2025" }
    role: { es: "Investigador, analista de datos", en: "Researcher, data analyst" }
    org: { es: Fondecyt N° 1231356, en: Fondecyt grant 1231356 }
    desc:
      es: "Estructuré y analicé un corpus longitudinal de 16 años de documentos de política económica (2006–2022) con métodos mixtos: codificación cuantitativa y análisis cualitativo. Gestioné el control de versiones y la documentación de datos en Git, para asegurar la reproducibilidad del pipeline de investigación. Entregué datasets estructurados y resúmenes analíticos para publicación académica revisada por pares."
      en: "I structured and analyzed a 16-year longitudinal corpus of economic policy documents (2006–2022) using mixed methods: quantitative coding and qualitative analysis. I managed version control and data documentation in Git to keep the research pipeline reproducible. I delivered structured datasets and analytical summaries for peer-reviewed publication."
  - id: voces
    when: { es: "abr 2023 – abr 2024", en: "Apr 2023 – Apr 2024" }
    role: { es: "Asistente de investigación, análisis estadístico", en: "Research assistant, statistical analysis" }
    org: Centro de Estudios Públicos (CEP)
    desc:
      es: "Sistematicé datos electorales y de opinión pública (Encuesta CEP, votaciones constitucionales 2023): limpieza, codificación y análisis descriptivo e inferencial. Elaboré el boletín *Voces del CEP*, traduciendo hallazgos de encuestas complejas en narrativas accesibles para audiencias de política pública."
      en: "I systematized electoral and public opinion data (CEP Survey, 2023 constitutional votes): cleaning, coding, and descriptive and inferential analysis. I produced the *Voces del CEP* bulletin, turning complex survey findings into accessible narratives for public policy audiences."
  - id: c22
    when: { es: "ago 2021 – abr 2024", en: "Aug 2021 – Apr 2024" }
    role: { es: "Asistente de investigación C22, humanidades digitales", en: "C22 research assistant, digital humanities" }
    org: { es: "CEP, proyecto C22", en: "CEP, C22 project" }
    desc:
      es: "Apliqué minería de texto y análisis de redes a grandes colecciones de documentos políticos para investigación socio-constitucional. Coautor de 13 publicaciones académicas basadas en análisis cuantitativo y computacional de datos legislativos y constitucionales."
      en: "I applied text mining and network analysis to large collections of political documents for socio-constitutional research. Co-author of 13 academic publications based on quantitative and computational analysis of legislative and constitutional data."
  - id: tironi
    when: { es: "ago 2021 – mar 2023", en: "Aug 2021 – Mar 2023" }
    role: { es: Analista de asuntos públicos, en: Public affairs analyst }
    org: Tironi y Asociados
    desc:
      es: "Recopilé, limpié y analicé datos políticos y electorales para el Boletín Constitucional 2022 y proyectos de consultoría estratégica. Entregué diagnósticos basados en datos en contextos políticos de alta velocidad."
      en: "I collected, cleaned and analyzed political and electoral data for the 2022 Constitutional Bulletin and strategic consulting projects. I delivered data-based assessments in fast-moving political contexts."


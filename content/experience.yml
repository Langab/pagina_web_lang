summary:
  es: |
    Soy sociólogo de la Universidad Diego Portales, titulado con distinción máxima y primero de mi generación. Me muevo entre la metodología cuantitativa, la investigación cualitativa y el código.

    Hoy trabajo como analista de datos en el Servicio Local de Educación Pública Santa Rosa. Antes validé datos del Censo 2024 en el INE, analicé el proceso constitucional en el CEP y codifiqué actas del Banco Central para un Fondecyt. Me gusta que un análisis termine en algo que otra persona pueda usar el lunes.
  en: |
    I'm a sociologist from Universidad Diego Portales, graduated with highest honors and first in my class. I work where quantitative methods, qualitative research and code meet.

    Today I'm a data analyst at Servicio Local de Educación Pública Santa Rosa, a public school district in southern Santiago. Before that I validated 2024 Census data at INE, analyzed Chile's constitutional process at CEP and coded Central Bank minutes for a Fondecyt research grant. I like analysis that ends in something another person can use on Monday.

target:
  kicker: { es: Rol que busco, en: Role I'm looking for }
  title: { es: "Analista de datos, BI o investigación aplicada", en: "Data analyst, BI or applied research" }
  text:
    es: "Cargos de análisis de datos, inteligencia de negocios o investigación aplicada, en instituciones públicas, centros de estudio o empresas que necesiten ordenar sus datos antes de decidir. Base en Santiago de Chile."
    en: "Roles in data analysis, business intelligence or applied research, in public institutions, think tanks or companies that need to organize their data before deciding. Based in Santiago, Chile."
  items:
    - { es: "Procesamiento y validación de datos a gran escala", en: "Large-scale data processing and validation" }
    - { es: "Tableros e informes que se actualizan solos", en: "Self-updating dashboards and reports" }
    - { es: "Gobernanza de datos y documentación", en: "Data governance and documentation" }
    - { es: "Diseño y análisis de encuestas", en: "Survey design and analysis" }

jobs:
  - id: slep
    current: true
    home: true
    when: { es: "2025 – hoy", en: "2025 – now" }
    role: { es: Analista de datos, en: Data analyst }
    org: Servicio Local de Educación Pública Santa Rosa
    desc:
      es: "Llevo el flujo completo de datos del servicio: captura automatizada desde las plataformas del Ministerio, consolidación en R, validación mensual y diez tableros de Power BI publicados en el sitio interno. Genero además fichas por establecimiento e informes de matrícula, asistencia y trayectoria docente para las cinco comunas."
      en: "I run the service's full data flow: automated capture from the Ministry's platforms, consolidation in R, monthly validation and ten Power BI dashboards published on the internal site. I also produce school-level fact sheets and enrollment, attendance and teacher trajectory reports for the five municipalities."
  - id: aldeas
    current: true
    when: { es: "2025 – hoy", en: "2025 – now" }
    role: { es: Consultor en habilidades digitales, en: Digital skills consultant }
    org: Aldeas Infantiles SOS Chile con MICELIA
    desc:
      es: "Diagnóstico mixto de brechas digitales con el marco europeo DigComp 2.2 y grupos focales en cuatro aldeas, y el plan de formación 2026 que salió de ahí. Lidero los talleres de la sede Quilpué."
      en: "Mixed-methods assessment of digital skills gaps using the European DigComp 2.2 framework and focus groups in four villages, plus the 2026 training plan that followed. I lead the workshops at the Quilpué site."
  - id: prieto
    current: true
    home: true
    when: { es: "2025 – hoy", en: "2025 – now" }
    role: { es: "Analista cuantitativo y coautor", en: "Quantitative analyst and co-author" }
    org: Investigación con Joaquín Prieto
    desc:
      es: "Índice multidimensional de inseguridad económica con el panel ELSOC 2016–2023, modelos logísticos por bloques con imputación múltiple y análisis de mediación. Coautor de *Economic Insecurity, Not Inequality?* y analista en *Insecurity amid Recovery*, con la Encuesta de Bienestar Social del INE."
      en: "Multidimensional economic insecurity index using the ELSOC 2016–2023 panel, block-wise logistic models with multiple imputation and mediation analysis. Co-author of *Economic Insecurity, Not Inequality?* and analyst on *Insecurity amid Recovery*, using INE's Social Wellbeing Survey."
  - id: ine
    home: true
    when: { es: "2024 – 2025", en: "2024 – 2025" }
    role: { es: "Analista metodológico senior, Censo 2024", en: "Senior methods analyst, 2024 Census" }
    org: Instituto Nacional de Estadísticas (INE)
    desc:
      es: "Validación, edición e imputación de las variables de persona (sexo, edad y parentesco) dentro del código en R del procesamiento censal, más la codificación de respuestas del cuestionario en papel. Construí informes de calidad e indicadores demográficos comparados con los censos de 2017, 2002 y 1992."
      en: "Validation, editing and imputation of person-level variables (sex, age and relationship) inside the R codebase of census processing, plus coding of paper questionnaire answers. I built quality reports and demographic indicators compared with the 2017, 2002 and 1992 censuses."
  - id: fondecyt-bc
    home: true
    when: { es: "2024 – 2025", en: "2024 – 2025" }
    role: { es: "Investigador, Fondecyt N° 1231356", en: "Researcher, Fondecyt grant 1231356" }
    org: Universidad Diego Portales
    desc:
      es: "Codifiqué con GPT-4o los 1.467 memorandos del Comité Ejecutivo del Banco Central entre 1981 y 1983, y analicé la base con redes de co-ocurrencia, detección de comunidades y modelos de tópicos. Presenté método y resultados preliminares al equipo en dos entregas."
      en: "I coded the 1,467 Central Bank Executive Committee memos from 1981 to 1983 with GPT-4o, and analyzed the dataset with co-occurrence networks, community detection and topic models. I presented the method and preliminary results to the team twice."
  - id: voces
    when: { es: "2023 – 2024", en: "2023 – 2024" }
    role: { es: "Investigador asistente, Voces del CEP", en: "Research assistant, Voces del CEP" }
    org: Centro de Estudios Públicos (CEP)
    desc:
      es: Edición y publicación del boletín *Voces del CEP*, seguimiento del segundo proceso constitucional y datos electorales y de opinión pública.
      en: Editing and publishing the *Voces del CEP* bulletin, tracking the second constitutional process, plus electoral and public opinion data.
  - id: c22
    home: true
    when: { es: "2021 – 2024", en: "2021 – 2024" }
    role: { es: "Asistente de investigación, C22", en: "Research assistant, C22" }
    org: Centro de Estudios Públicos (CEP)
    desc:
      es: "Análisis de votaciones con escalamiento tipo NOMINATE, procesamiento de discursos y prensa, y visualización de datos políticos. Coautor de siete Puntos de Referencia del CEP y seis notas de investigación de C22."
      en: "Vote analysis with NOMINATE-style scaling, processing of speeches and press coverage, and political data visualization. Co-author of seven CEP policy papers and six C22 research notes."
  - id: tironi
    home: true
    when: { es: "2021 – 2023", en: "2021 – 2023" }
    role: { es: Analista de asuntos públicos, en: Public affairs analyst }
    org: Tironi y Asociados
    desc:
      es: "A cargo del boletín constitucional semanal de 2022 para clientes corporativos: qué se votó en la Convención, qué cambió y qué implicaba para cada industria. Además procesé encuestas internas y datos secundarios para diagnósticos organizacionales."
      en: "In charge of the weekly constitutional bulletin for corporate clients in 2022: what the Convention voted, what changed and what it meant for each industry. I also processed internal surveys and secondary data for organizational diagnostics."
  - id: chiloe
    when: { es: "2022 – 2023", en: "2022 – 2023" }
    role: { es: "Asistente de investigación, Fondecyt N° 1190295", en: "Research assistant, Fondecyt grant 1190295" }
    org: Universidad Diego Portales
    desc:
      es: "Transiciones críticas en sistemas socioecológicos en Chiloé. Preparé bases de datos, codifiqué entrevistas en Atlas.ti siguiendo el esquema del proyecto y apoyé la revisión de literatura."
      en: "Critical transitions in social-ecological systems in Chiloé. I prepared datasets, coded interviews in Atlas.ti following the project's scheme and supported the literature review."
  - id: tesista
    when: { es: "2020 – 2021", en: "2020 – 2021" }
    role: { es: "Tesista, Fondecyt N° 1181585", en: "Thesis researcher, Fondecyt grant 1181585" }
    org: Universidad Diego Portales
    desc:
      es: Tesis de pregrado dentro de un proyecto Fondecyt de investigación sociológica.
      en: Undergraduate thesis within a funded Fondecyt sociology project.


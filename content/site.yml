# Páginas: la misma página existe en ambos idiomas con su propia URL.
pages:
  - id: home
    template: pages/home.html
    path: { es: "", en: "en/" }
    title: { es: Inicio, en: Home }
    description:
      es: "Portafolio de Benjamín Lang, sociólogo y analista de datos en Santiago de Chile. Censo 2024 en el INE, investigación en el CEP y la UDP, datos de educación pública y herramientas propias con Python e IA."
      en: "Portfolio of Benjamín Lang, sociologist and data analyst in Santiago, Chile. 2024 Census at INE, research at CEP and UDP, public education data, and self-built tools with Python and AI."
  - id: portafolio
    template: pages/portafolio.html
    path: { es: portafolio/, en: en/portfolio/ }
    title: { es: Portafolio, en: Portfolio }
    description:
      es: "Proyectos de datos de punta a punta que construí por mi cuenta: visores que se actualizan solos, agentes de IA y análisis con código abierto."
      en: "End-to-end data projects I built on my own: self-updating viewers, AI agents and open-source analysis."
  - id: trabajos
    template: pages/trabajos.html
    path: { es: trabajos/, en: en/work/ }
    title: { es: "Trabajos, proyectos y consultoría", en: "Work, projects and consulting" }
    description:
      es: "Experiencia en sector público, sector privado, investigación académica y consultorías. Qué hice en cada proyecto, con qué herramientas y qué salió."
      en: "Experience across the public sector, private companies, academic research and consulting. What I did on each project, with which tools and what came out of it."
  - id: publications
    template: pages/publications.html
    path: { es: publicaciones/, en: en/publications/ }
    title: { es: Publicaciones, en: Publications }
    description:
      es: "Artículo académico, policy papers del Centro de Estudios Públicos y notas de investigación de C22."
      en: "Peer-reviewed article, policy papers for Centro de Estudios Públicos and C22 research notes."
  - id: cv
    template: pages/cv.html
    path: { es: cv/, en: en/cv/ }
    title: { es: CV, en: CV }
    description:
      es: "Experiencia laboral, formación, habilidades técnicas y docencia de Benjamín Lang."
      en: "Work experience, education, technical skills and teaching of Benjamín Lang."


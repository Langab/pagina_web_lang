name: Benjamín Lang
full_name: Benjamín Lang Bustos
url: https://langab.github.io/pagina_web_lang/
tagline:
  es: Sociólogo y analista de datos
  en: Sociologist and data analyst
description:
  es: Sociólogo y analista de datos en Santiago de Chile. Censo 2024 en el INE, investigación en el CEP y la UDP, datos de educación pública y herramientas propias con Python y agentes de IA.
  en: Sociologist and data analyst based in Santiago, Chile. 2024 Census at INE, research at CEP and UDP, public education data, and self-built tools with Python and AI agents.

contact:
  email: benjalang1997@gmail.com
  phone: "+56 9 6309 5562"
  phone_href: "+56963095562"
  linkedin: https://www.linkedin.com/in/benjamin-lang-a78229207/
  github: https://github.com/Langab
  cv:
    es: CV_Lang_DataAnalyst_ES.pdf
    en: CV_Lang_DataAnalyst_EN.pdf

# Páginas: la misma página existe en ambos idiomas con su propia URL.
pages:
  - id: home
    template: pages/home.html
    path: { es: "", en: "en/" }
    title: { es: Inicio, en: Home }
    description:
      es: Sociólogo y analista de datos en Santiago de Chile. Censo 2024 en el INE, investigación en el CEP y la UDP, datos de educación pública y herramientas propias con Python y agentes de IA.
      en: Sociologist and data analyst based in Santiago, Chile. 2024 Census at INE, research at CEP and UDP, public education data, and self-built tools with Python and AI agents.
  - id: projects
    template: pages/projects.html
    path: { es: proyectos/, en: en/projects/ }
    title: { es: Proyectos, en: Projects }
    description:
      es: Herramientas que construí por mi cuenta y proyectos de investigación, sector público y consultoría en los que participé.
      en: Tools I built on my own, plus the research, public-sector and consulting projects I worked on.
  - id: cv
    template: pages/cv.html
    path: { es: trayectoria/, en: en/experience/ }
    title: { es: Trayectoria, en: Experience }
    description:
      es: Experiencia laboral, formación, habilidades técnicas y docencia de Benjamín Lang.
      en: Work experience, education, technical skills and teaching of Benjamín Lang.
  - id: publications
    template: pages/publications.html
    path: { es: publicaciones/, en: en/publications/ }
    title: { es: Publicaciones, en: Publications }
    description:
      es: Artículo académico, policy papers del Centro de Estudios Públicos y notas de investigación de C22.
      en: Peer-reviewed article, policy papers for Centro de Estudios Públicos and C22 research notes.

nav:
  - { id: projects, label: { es: Proyectos, en: Projects } }
  - { id: cv, label: { es: Trayectoria, en: Experience } }
  - { id: publications, label: { es: Publicaciones, en: Publications } }

# URL del sitio anterior (Quarto) → página nueva. Así no se rompen enlaces viejos.
legacy_redirects:
  - [index-en.html, home, en]
  - [about.html, cv, es]
  - [about-en.html, cv, en]
  - [trabajos.html, projects, es]
  - [trabajos-en.html, projects, en]
  - [publicaciones.html, publications, es]
  - [publicaciones-en.html, publications, en]
  - [portafolio/index.html, projects, es]
  - [portafolio-en/index.html, projects, en]
  - [blog/index.html, projects, es]
  - [blog/posts/visor-arriendos/index.html, "project:visor-arriendos", es]

